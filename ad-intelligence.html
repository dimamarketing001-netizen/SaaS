   const s=await api(base);
   if(s.captcha_required&&s.screenshot_b64){box.hidden=false;img.src="data:image/jpeg;base64,"+s.screenshot_b64}
   else box.hidden=true;
  }catch(e){}
  if(!stopped)timer=setTimeout(tick,1200);
 };
 tick();
 return()=>{stopped=true;clearTimeout(timer);host.innerHTML=""};
}

   существовали на момент сохранения). Сливаем свежий seed() с сохранённым на два
   уровня — так отсутствующие вложенные поля (например S.intel.f.page, добавленное
   позже, чем S.intel.f целиком) всегда получают дефолт из seed(), а не undefined. */
function mergeState(fresh,savedPart){
  if(!savedPart||typeof savedPart!=="object")return fresh;
  for(const k of Object.keys(fresh)){
    if(savedPart[k]===undefined)continue;
    const fv=fresh[k],sv=savedPart[k];
    if(fv&&sv&&typeof fv==="object"&&typeof sv==="object"&&!Array.isArray(fv)&&!Array.isArray(sv))fresh[k]=Object.assign(fv,sv);
    else fresh[k]=sv;
  }
  return fresh;
}

function resizeImageFile(file,size){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=size;c.height=size;
      const ctx=c.getContext("2d"),side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
      ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",0.86));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Не удалось прочитать изображение"))};
    img.src=url;
  });
}

    body:`<div class="row" style="justify-content:flex-end;margin-bottom:8px"><nv-button variant="ghost" size="sm" icon="settings" icon-only hint="Настроить уведомления" data-notif-settings>Настроить уведомления</nv-button></div>
    ${list.length?`<div class="list">${list.map(x=>{const meta=NOTIF_TYPES[x.type]||{icon:"bell"};
      return `<div class="stack" style="gap:2px;padding:8px 0;border-top:1px solid var(--line)"><div class="row" style="gap:8px;align-items:flex-start">${ic(meta.icon,15)}<div style="flex:1;min-width:0"><div>${esc(x.title)}</div>${x.text?`<div class="muted" style="font-size:12.5px">${esc(x.text)}</div>`:""}<div class="row between" style="margin-top:3px"><span class="muted" style="font-size:12px">${esc(NEON.ago(new Date(x.created_at).getTime()))}</span>${x.link?`<nv-button variant="link" size="sm" data-go="${esc(x.link)}">Открыть</nv-button>`:""}</div></div></div></div>`;
    }).join("")}</div>`:`<nv-empty icon="bell" heading="Пока тихо" text="Здесь появятся завершённые сканирования, несовпадения посадочной и другие события."></nv-empty>`}`,
    mount(root,close){root.querySelector("[data-notif-settings]").onclick=()=>{close();NEON.acts.account(null,{section:"notifications"})}}
  });
  if(NOTIF.unreadCount){try{await apiPost("/api/v1/notifications/read-all",{})}catch(e){}NOTIF.unreadCount=0;updBell()}
};
NEON.acts.account=async(a,d)=>{
  if(!PROFILE.loaded)await loadProfile();
  const prefRows=Object.entries(NOTIF_TYPES).map(([id,meta])=>({id,label:meta.label,values:[PROFILE.prefs[id]!==false]}));
  overlay("drawer",{title:"Профиль",subtitle:PROFILE.email||session.email,size:"md",
    body:`<div class="sect-t">Профиль</div>
    <nv-avatar-upload name="${esc(PROFILE.name||session.email||"?")}" image="${esc(PROFILE.avatarDataUrl||"")}" hint="PNG или JPG, обрежется квадратом"></nv-avatar-upload>
    <nv-input name="name" label="Имя" value="${esc(PROFILE.name||"")}" placeholder="Например, Дима"></nv-input>
    <dl class="dl"><dt>Email</dt><dd>${esc(PROFILE.email||session.email||"—")}</dd><dt>Роль</dt><dd>${esc(PROFILE.role==="admin"?"Администратор":"Клиент")}</dd></dl>
    <nv-button variant="primary" size="sm" data-act-save-profile>Сохранить профиль</nv-button>
    <div class="sect-t" style="margin-top:18px">Пароль</div>
    <nv-password-input name="curpw" label="Текущий пароль"></nv-password-input>
    <nv-password-input name="newpw" label="Новый пароль" strength></nv-password-input>
    <nv-button variant="secondary" size="sm" data-act-change-pw>Сменить пароль</nv-button>
    <div class="sect-t" id="notif-prefs-sect" style="margin-top:18px">Уведомления</div>
    <nv-notify-matrix channels="В сервисе" rows='${esc(JSON.stringify(prefRows))}'></nv-notify-matrix>
    <nv-button variant="danger" full icon="log-out" data-act="logout" style="margin-top:18px">Выйти</nv-button>`,
    mount(root){
      if(d&&d.section==="notifications")setTimeout(()=>root.querySelector("#notif-prefs-sect")?.scrollIntoView({block:"start"}),50);
      const au=root.querySelector("nv-avatar-upload");
      /* nv-avatar-upload's own change handler calls this.update() (replacing its <input>,
         wiping .files) BEFORE it emits nv-change — so by the time a bubble-phase nv-change
         listener runs, the File is already gone. A capture-phase "change" listener on an
         ancestor fires on the way DOWN, before the input's own handler runs at all. */
      root.addEventListener("change",e=>{
        if(!e.target.matches('nv-avatar-upload input[type="file"]'))return;
        const file=e.target.files[0];
        if(!file)return;
        resizeImageFile(file,160).then(dataUrl=>apiPost("/api/v1/profile/avatar",{data_url:dataUrl}).then(()=>{
          PROFILE.avatarDataUrl=dataUrl;
          document.querySelectorAll(".top-av nv-avatar").forEach(el=>el.setAttribute("src",dataUrl));
          toast("Фото обновлено",{tone:"success"});
        })).catch(err=>toast("Не удалось загрузить фото: "+(err.message||""),{tone:"danger"}));
      },true);
      au.addEventListener("nv-error",e=>toast(e.detail.message,{tone:"danger"}));
      root.querySelector("[data-act-save-profile]").onclick=async()=>{
        const name=root.querySelector('nv-input[name="name"]').value.trim();
        try{await apiPatch("/api/v1/profile",{name});PROFILE.name=name;toast("Профиль сохранён",{tone:"success"});render()}
        catch(err){toast("Не удалось сохранить: "+(err.message||""),{tone:"danger"})}
      };
      root.querySelector("[data-act-change-pw]").onclick=async()=>{
        const curEl=root.querySelector('nv-password-input[name="curpw"]'),newEl=root.querySelector('nv-password-input[name="newpw"]');
        const cur=curEl.value,nw=newEl.value;
        if(!cur||!nw){toast("Заполните оба поля",{tone:"warning"});return}
        if(nw.length<8){toast("Новый пароль — минимум 8 символов",{tone:"warning"});return}
        try{await apiPost("/api/v1/auth/change-password",{current_password:cur,new_password:nw});toast("Пароль изменён",{tone:"success"});curEl.value="";newEl.value=""}
        catch(err){toast("Не удалось сменить пароль: "+(err.message||""),{tone:"danger"})}
      };
      root.querySelector("nv-notify-matrix").addEventListener("nv-toggle",async e=>{
        PROFILE.prefs[e.detail.id]=e.detail.value;
        try{await apiPut("/api/v1/profile/notification-prefs",{prefs:PROFILE.prefs})}
        catch(err){toast("Не удалось сохранить настройку: "+(err.message||""),{tone:"danger"})}
      });
    }
  });
};
NEON.acts.logout=()=>{localStorage.removeItem("parsya_session");location.replace("index.html")};

/* Поиск и команды: Ctrl+K */
function palItems(q){q=q.trim().toLowerCase();const out=[],hit=t=>!q||t.toLowerCase().includes(q);
  NEON.commands.forEach(c=>{if(hit(c.label))out.push({g:"Действия",icon:c.icon||"zap",label:c.label,sub:NEON.services[c.svc].name,run:c.run})});
  NEON.order.forEach(id=>{const x=NEON.services[id];(x.nav||[]).forEach(g=>g.items.forEach(i=>{if(hit(i.label+" "+x.name))out.push({g:"Экраны",icon:i.icon,label:i.label,sub:x.name,run(){NEON.go(id+"-"+i.id)}})}))});
  NEON.order.forEach(id=>{const x=NEON.services[id];if(x.search&&q)x.search(q).forEach(r=>out.push({...r,g:x.name}))});
  return out.slice(0,40)}
NEON.acts.palette=()=>{if(document.querySelector(".pal-ov"))return;
  const root=document.createElement("div");root.className="ov pal-ov";root.innerHTML=`<div class="dlg pal" role="dialog" aria-modal="true" aria-label="Поиск"><div class="pal-i">${ic("search",17)}<input id="pal-q" placeholder="Что вы хотите найти или сделать?" autocomplete="off"><nv-button variant="ghost" size="sm" data-x>Esc</nv-button></div><div class="pal-l" role="listbox"></div></div>`;
  document.body.append(root);let items=[],idx=0;const list=root.querySelector(".pal-l"),inp=root.querySelector("input"),prev=document.activeElement;
  const close=()=>{root.remove();prev&&prev.focus&&prev.focus()};
  const draw=()=>{items=palItems(inp.value);idx=Math.min(idx,Math.max(0,items.length-1));let g="";list.innerHTML=items.length?items.map((x,i)=>{const h=x.g!==g?`<h5>${esc(g=x.g)}</h5>`:"";return `${h}<button type="button" role="option" class="${i===idx?"act":""}" data-i="${i}">${ic(x.icon||"circle",16)}<span>${esc(x.label)}</span><small>${esc(x.sub||"")}</small></button>`}).join(""):`<nv-empty icon="search-x" heading="Ничего не нашлось" text="Попробуйте другое слово, например «кроссовки»."></nv-empty>`;const a=list.querySelector(".act");a&&a.scrollIntoView({block:"nearest"})};
  const run=i=>{const x=items[i];if(x){close();x.run()}};
  inp.oninput=()=>{idx=0;draw()};
  root.addEventListener("keydown",e=>{if(e.key==="Escape"){close();e.stopPropagation()}else if(e.key==="ArrowDown"){idx=Math.min(items.length-1,idx+1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){idx=Math.max(0,idx-1);draw();e.preventDefault()}else if(e.key==="Enter"&&e.target===inp){run(idx);e.preventDefault()}});
  list.onclick=e=>{const b=e.target.closest("[data-i]");if(b)run(+b.dataset.i)};
  root.addEventListener("mousedown",e=>{if(e.target===root)close()});root.querySelector("[data-x]").onclick=close;draw();inp.focus()};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"||(e.ctrlKey&&e.code==="KeyK")){e.preventDefault();NEON.acts.palette()}});

NEON.start=render;
})();
</script>
<script>
/* Разведка рекламы (Ad Intelligence) — единственный реальный сервис.
   Поля и статусы совпадают с /api/v1/creatives, /api/v1/runs, /api/v1/collections,
   /api/v1/advertisers, /api/v1/analytics/* и /api/v1/intents парсера. Бек не менялся —
   меняется только то, как это рисуется (дизайн-система NEON). */
(function(){
const {esc,ic,fmt,overlay,toast,confirm,formVals,FORMAT,favUrl,iconSvg,rngPct}=NEONUI,N=NEON,S=N.state;

const RUN_STATUS_MAP={queued:"queued",running:"running",succeeded:"done",failed:"failed"};

function hostOf(u){
  if(!u)return"";
  try{return new URL(u.includes("://")?u:"https://"+u).hostname}catch(e){return u.replace(/^https?:\/\//,"").split("/")[0]}
}
function fmtDateTime(iso){
  if(!iso)return"—";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"—";
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+", "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function realPlatformLabel(m){
  m=m||"";
  if(m.startsWith("vk-native"))return"VK Ads";
  if(m.startsWith("google-ads"))return"Google Ads";
  if(m.startsWith("taboola"))return"Taboola";
  if(m.startsWith("native-feed"))return"Яндекс Дзен";
  return"Яндекс / РСЯ";
}
function formatOf(rep){
  if(rep.creative_type==="video"||rep.video_src)return"video";
  if(rep.carousel_id!=null)return"carousel";
  if(rep.image_url)return"image";
  return"native";
}
function groupRealCreatives(items){
  const groups={},order=[];
  for(const row of items||[]){
    const key=row.content_fingerprint||("hash:"+row.creative_hash);
    if(!groups[key]){groups[key]={group_key:key,representative:row,platforms:[],first_seen_at:row.captured_at,last_seen_at:row.captured_at};order.push(key)}
    const g=groups[key];
    if(!g.platforms.includes(row.platform))g.platforms.push(row.platform);
    if(row.captured_at<g.first_seen_at)g.first_seen_at=row.captured_at;
    if(row.captured_at>=g.last_seen_at){g.last_seen_at=row.captured_at;g.representative=row}
  }
  return order.map(k=>groups[k]);
}

const seed=()=>({
  f:{q:"",platform:"",format:"",saved:"",job:"",rel:"all",aiIntent:"",sort:"recent",period:"",page:1,pageSize:25},
  aiIntents:[],aiPending:0,aiLoaded:false,
  savedViews:loadSavedViews(),
  lib:{groups:[],total:0,loaded:false,loading:false},
  sel:[],cmp:[],cmpF:{q:"",platform:"",format:"",period:"",adv:""},
  savedIds:loadSavedCreativeIds(),
  collections:[],collectionsLoaded:false,collectionItemsCache:{},openK:null,
  schedules:[],schedulesLoaded:false,scans:[],scansLoaded:false,scanF:{q:"",status:""},schedTab:"live",
  advertisers:[],advertisersLoaded:false,advQ:"",advSub:"all",
  intents:[],intentsLoaded:false,activeIntents:getActiveIntents(),
  ana:{loaded:false,loading:false,platSub:"coverage",campSub:"campaigns",freshSub:"fresh",totals:{},coverage:[],breakdown:[],fresh:[],freshTotal:0,discounts:[],discTotal:0,apps:[],appsTotal:0,cross:[],carousels:[],campaigns:[],keywords:[],growing:[],mismatch:[],coverageReport:[]}
});

const CR=()=>S.intel.lib.groups;
function findGroup(id){
  const pools=[CR(),S.intel._lastCollectionItems||[],S.intel.cmp,S.intel.sel];
  for(const p of pools){const g=p.find(x=>String(x.representative.id)===String(id));if(g)return g}
  return null;
}
function anyF(){const f=S.intel.f;return f.q||f.platform||f.format||f.saved||f.job||f.aiIntent||(f.period&&f.period!=="all")}
const VIEW_FIELDS=["q","platform","format","saved","job","aiIntent","sort","period"];
const viewKey=f=>JSON.stringify(VIEW_FIELDS.map(k=>f[k]||""));
function activeViewId(){const f=S.intel.f,key=viewKey(f),v=S.intel.savedViews.find(x=>viewKey(x.f)===key);return v?v.id:""}
function filtered(){
  const I=S.intel,f=I.f,savedSet=new Set(I.savedIds);
  let r=CR().filter(g=>{
    const rep=g.representative;
    if(f.platform&&realPlatformLabel(rep.detection_method)!==f.platform)return false;
    if(f.format&&formatOf(rep)!==f.format)return false;
    if(f.saved==="yes"&&!savedSet.has(String(rep.id)))return false;
    if(f.saved==="no"&&savedSet.has(String(rep.id)))return false;
    return true;
  });
  if(f.sort==="name")r=[...r].sort((a,b)=>(a.representative.domain||"").localeCompare(b.representative.domain||"","ru"));
  else if(f.sort==="oldest")r=[...r].reverse();
  return r;
}
function cmpFiltered(){
  const f=S.intel.cmpF,q=(f.q||"").toLowerCase(),rg=NEONUI.rangeOf(f.period);
  return CR().filter(g=>{
    const rep=g.representative;
    if(f.adv&&rep.domain!==f.adv)return false;
    if(f.platform&&realPlatformLabel(rep.detection_method)!==f.platform)return false;
    if(f.format&&formatOf(rep)!==f.format)return false;
    if(rg){const t=+new Date(g.last_seen_at||rep.captured_at);if(t<rg[0]||t>rg[1])return false}
    if(q&&!((rep.title||"")+(rep.domain||"")+(rep.description||"")).toLowerCase().includes(q))return false;
    return true;
  });
}
function cmpMatrixHtml(){
  const c=S.intel.cmp;
  if(c.length<2)return `<nv-empty icon="columns-3" heading="Сравнивать пока нечего" text="Отметьте флажком от 2 до 4 объявлений в списке кандидатов ниже."></nv-empty>`;
  const plans=c.map(g=>(g.representative.domain||"—")+" · "+(g.representative.title||g.representative.domain||"").slice(0,22));
  const rows=[
    {label:"Площадка",values:c.map(g=>realPlatformLabel(g.representative.detection_method))},
    {label:"Формат",values:c.map(g=>FORMAT[formatOf(g.representative)]||g.representative.creative_type||"—")},
    {label:"Заголовок",values:c.map(g=>g.representative.title||"—")},
    {label:"Текст объявления",values:c.map(g=>g.representative.description||"—")},
    {label:"Кнопка (CTA)",values:c.map(g=>g.representative.cta_text||"—")},
    {label:"Цена",values:c.map(g=>g.representative.price_text||(g.representative.price_rub?fmt(g.representative.price_rub)+" ₽":"нет"))},
    {label:"Скидка",values:c.map(g=>g.representative.discount_percent?g.representative.discount_percent+"%":"нет")},
    {label:"ERID",values:c.map(g=>g.representative.erid||"нет")},
    {label:"Ключевое слово запуска",values:c.map(g=>(g.representative.intents||[]).join(", ")||"—")},
    {label:"Интент креатива (Gemini)",values:c.map(g=>realAiIntent(g.representative)||"—")},
    {label:"Замечено",values:c.map(g=>N.rel(g.last_seen_at||g.representative.captured_at))}
  ];
  return `<nv-plan-compare diff plans="${esc(plans.join("|"))}" rows="${esc(JSON.stringify(rows))}"></nv-plan-compare>
  <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap">${c.map(g=>`<nv-button size="sm" variant="ghost" icon="x" data-act="cmpAdd" data-id="${g.representative.id}">Убрать: ${esc(g.representative.domain||"—")}</nv-button>`).join("")}</div>`;
}
const AI_UNKNOWN="не определён";
function realAiIntent(c){return c&&c.ai_intent&&c.ai_intent!==AI_UNKNOWN?c.ai_intent:""}
function cardHtml(g,selected){
  const rep=g.representative,saved=S.intel.savedIds.includes(String(rep.id));
  const primary=realPlatformLabel(rep.detection_method);
  const otherPlatforms=[...new Set((g.platforms||[]).map(realPlatformLabel))].filter(l=>l!==primary);
  const fmt=formatOf(rep);
  const mediaAttrs=(fmt==="video"&&rep.video_src)?`video="${esc(rep.video_src)}" poster="${esc(rep.video_poster||"")}"`:`image="${esc(rep.image_url||"")}"`;
  return `<nv-creative-card cid="${esc(rep.id)}" headline="${esc(rep.title||rep.domain||"Без заголовка")}" advertiser="${esc(rep.domain||"—")}" domain="${esc(rep.domain||"")}" platform="${esc(primary)}" format="${fmt}" date="${esc(fmtDateTime(g.last_seen_at||rep.captured_at))}" discount="${rep.discount_percent||""}" cta="${esc(rep.cta_text||"")}" ${mediaAttrs} ai-intent="${esc(realAiIntent(rep))}" keyword="${esc((rep.intents||[]).join("; "))}" copy="${esc((rep.description||"").slice(0,180))}" desc-full="${esc(rep.description||"")}" platforms="${esc(otherPlatforms.join(","))}" ${saved?"saved":""} selectable ${selected?"selected":""}></nv-creative-card>`;
}
function bindCards(root,target){
  target=target||"sel";
  if(!root||root._bound)return;
  root._bound=true;
  root.addEventListener("nv-open",e=>openCreative(e.detail.id));
  root.addEventListener("nv-save",e=>{
    const id=String(e.detail.id);let ids=S.intel.savedIds;
    if(e.detail.saved){if(!ids.includes(id))ids.push(id)}else{ids=ids.filter(x=>x!==id)}
    S.intel.savedIds=ids;persistSavedCreativeIds(ids);
    e.target.toggleAttribute("saved",e.detail.saved);
    toast(e.detail.saved?"Сохранено в избранное":"Убрано из избранного");
  });
  root.addEventListener("nv-select",e=>{
    const id=String(e.detail.id),g=findGroup(id);if(!g)return;
    const arr=S.intel[target],i=arr.findIndex(x=>String(x.representative.id)===id);
    if(e.detail.selected){
      if(i<0){
        if(target==="cmp"&&arr.length>=4){toast("Сравнить можно до 4 креативов. Сначала уберите один",{tone:"warning"});return}
        arr.push(g);
      }
    }else if(i>=0)arr.splice(i,1);
    N.save();
    if(target==="sel"){e.target.toggleAttribute("selected",e.detail.selected);libBulk()}
    else N.refresh();
  });
}
function anaSub(text){
  const a=S.intel.activeIntents||[];
  return text+(a.length?" Данные по запросам: "+a.map(x=>"«"+x+"»").join(", ")+".":" Данные по всем запросам — выберите «Ключевое слово запуска», чтобы сузить.");
}
function intentControlHtml(){
  const I=S.intel,opts=I.intents.map(i=>esc(i.intent)+":"+esc(i.intent)+" ("+(i.creatives_count||0)+")").join("|");
  return `<nv-filter-select label="Ключевое слово запуска" value="${esc(I.activeIntents.join(","))}" options="${opts||"_:Пока нет запросов"}" placeholder="Все запросы" min-width="360" data-chg="intentSet"></nv-filter-select>`;
}

/* ---------- Библиотека ---------- */
async function loadLibrary(extra){
  const I=S.intel;I.lib.loading=true;
  const seq=I._libSeq=(I._libSeq||0)+1;  // ответы приходят в любом порядке — учитываем только последний запрос
  if(document.getElementById("lib-res"))libRes();else N.refreshIf("intel-library","intel-compare");
  const params={sort:I.f.sort==="discount"?"discount":"recent",limit:120};
  if(I.f.q)params.q=I.f.q;
  // Фильтр по запуску: показываем креативы именно этого задания, без сужения по ключевому слову
  if(I.f.job){params.job_id=I.f.job;params.intent="";if(I.f.rel==="yes"||I.f.rel==="no")params.only_relevant=I.f.rel==="yes"?"1":"no"}
  if(I.f.aiIntent)params.ai_intent=I.f.aiIntent;
  const rg=NEONUI.rangeOf(I.f.period);
  if(rg)params.date_from=new Date(rg[0]).toISOString().slice(0,10);
  Object.assign(params,extra||{});
  try{
    const data=await api("/api/v1/creatives",params);
    if(seq!==I._libSeq)return;
    I.lib.groups=groupRealCreatives(data.items);
    I.lib.total=data.total;
    I.lib.loaded=true;
  }catch(err){if(seq!==I._libSeq)return;I.lib.loaded=true;toast("Не удалось загрузить креативы: "+(err.message||""),{tone:"danger"})}
  I.lib.loading=false;
  refreshLibSafe();
  if(!I._aiT||Date.now()-I._aiT>30000||(I._aiJob||"")!==String(I.f.job||""))loadAiIntents();
}
/* Перерисовка библиотеки не должна ломать открытый выпадающий фильтр: пока он открыт — обновляем только список, остальное после закрытия */
function refreshLibSafe(){
  if(document.querySelector("body > .pop")){
    if(document.getElementById("lib-res"))libRes();
    clearTimeout(S.intel._popW);
    const w=()=>{if(document.querySelector("body > .pop"))S.intel._popW=setTimeout(w,250);else N.refreshIf("intel-library","intel-compare")};
    S.intel._popW=setTimeout(w,250);return;
  }
  N.refreshIf("intel-library","intel-compare");
}
function closeAllLayers(){document.querySelectorAll(".ov [data-x]").forEach(b=>b.click())}
function relCheckHtml(){
  const f=S.intel.f,r=jobRel(f.job);
  const hint=r&&r.found?` (${r.relevant} из ${r.found}${r.pending?", ещё определяется "+r.pending:""})`:"";
  return `<nv-checkbox label="Показывать только по интенту${hint}" ${f.rel==="yes"?"checked":""} data-chg="libRel"></nv-checkbox>`;

function jobRel(id){const j=(S.intel.scans||[]).find(x=>String(x.id)===String(id));return j&&j.rel?j.rel:null}

async function loadAiIntents(){
  /* Интенты креативов: при выбранном запуске — только его интенты, без запуска — все */
  const I=S.intel,job=String(I.f.job||"");I._aiT=Date.now();I._aiJob=job;
  try{
    const d=await api("/api/v1/ai-intents",job?{job_id:job}:{});
    if(job!==String(I.f.job||""))return;  // запуск успели сменить — ответ устарел
    I.aiIntents=d.items||[];I.aiPending=d.pending||0;I.aiLoaded=true;
    // выбранные интенты, которых нет у этого запуска, снимаем
    const have=new Set(I.aiIntents.map(x=>String(x.intent||"").toLowerCase()).concat(I.aiPending?["__pending__"]:[]));
    const keep=String(I.f.aiIntent||"").split(",").filter(Boolean).filter(x=>have.has(x.toLowerCase()));
    if(keep.join(",")!==String(I.f.aiIntent||"")){I.f.aiIntent=keep.join(",");I.f.page=1;loadLibrary();return}
    refreshLibSafe();
  }catch(err){I.aiLoaded=true}
}
function aiIntentOptions(){
  const I=S.intel,clean=t=>String(t||"").replace(/[:|,]/g," ").trim();
  const list=I.aiIntents.filter(x=>x.intent&&x.intent!==AI_UNKNOWN).map(x=>clean(x.intent)+":"+clean(x.intent)+" ("+x.creatives_count+")");
  const unk=I.aiIntents.find(x=>x.intent===AI_UNKNOWN);
  if(unk)list.push(AI_UNKNOWN+":Не удалось определить ("+unk.creatives_count+")");
  if(I.aiPending)list.push("__pending__:Ещё определяется ("+I.aiPending+")");
  return list.join("|");
}

function fmtMinutes(ms){const m=Math.round(ms/60000);return m<1?"меньше минуты":m<60?m+" мин":Math.floor(m/60)+" ч"+(m%60?" "+(m%60)+" мин":"")}
/* Медиана длительности уже завершённых заданий — единственная честная база для оценки ETA у текущих. */
/* Среднее время ПОЛНЫХ запусков (все площадки, без обрывов) — считает сервер по последним 5 */
function fullRunMs(){const e=S.intel.eta;return e&&e.avg_full_seconds?e.avg_full_seconds*1000:null}
function stageText(st){
  if(!st)return"";
  if(st.kind==="sites")return"площадка "+st.index+" из "+st.total;
  if(st.kind==="dzen_main")return st.index?"Дзен, проход "+st.index+" из "+st.total:"Дзен"+(st.scroll?", прокрутка "+st.scroll+" из "+st.scroll_total:"");
  if(st.kind==="dzen_search")return"Дзен, предварительный поиск";

function scanDurationMedian(list){
  const durs=list.filter(s=>s.status==="succeeded"&&s.started_at&&s.finished_at).map(s=>new Date(s.finished_at)-new Date(s.started_at)).filter(d=>d>0).sort((a,b)=>a-b);
  return durs.length?durs[Math.floor(durs.length/2)]:null;
}
function scanCardInfo(s,medianMs){
  if(s.status==="succeeded"){
    const durMs=s.started_at&&s.finished_at?new Date(s.finished_at)-new Date(s.started_at):null;
    return{status:"done",pct:"100",note:durMs!=null?"Готово за "+fmtMinutes(durMs):"Готово"};
  }
  if(s.status==="failed"){
    const durMs=s.started_at&&s.finished_at?new Date(s.finished_at)-new Date(s.started_at):null;
    return{status:"failed",pct:"100",note:durMs!=null?"Ошибка через "+fmtMinutes(durMs):"Ошибка"};
  }
  if(s.status==="queued")return{status:"queued",pct:"0",note:"Ждёт воркера"};
  const stg=stageText(s.stage),pre=stg?stg+" · ":"";
  if(!s.started_at||!medianMs)return{status:"running",pct:"",indeterminate:true,note:pre+"Идёт сканирование…"};
  const elapsed=Date.now()-new Date(s.started_at),remain=medianMs-elapsed;
  const pct=Math.max(5,Math.min(96,Math.round(elapsed/medianMs*100)));
  return{status:"running",pct:String(pct),note:pre+(remain>0?"~"+fmtMinutes(remain)+" осталось":"дольше обычного ("+fmtMinutes(elapsed)+")")};
}
const FREQ_OPTS="once:Один раз|1:1 раз в день|2:2 раза в день|3:3 раза в день|4:4 раза в день|6:6 раз в день|8:8 раз в день|12:12 раз в день";
const DAYS_OPTS="7:7 дней|14:14 дней|30:30 дней";
function schedSummary(freq,days){
  if(freq==="once")return"Запуск один раз, сразу после создания.";
  const n=+freq,d=+days,total=n*d,gap=24/n,gapTxt=gap>=1?(Number.isInteger(gap)?gap+" ч":gap.toFixed(1).replace(".",",")+" ч"):Math.round(gap*60)+" мин";
  const end=new Date(Date.now()+d*864e5).toLocaleDateString("ru-RU",{day:"2-digit",month:"long"});
  return `Запусков: ${n} × ${d} = ${total}, примерно каждые ${gapTxt}. Первый — сразу, расписание действует до ${end}. Если предыдущий запуск ещё идёт, следующий слот пропускается. Для одного запроса используется один и тот же аккаунт Яндекса.`;
}

const SCHED_STATUS={active:["Активно","success"],paused:["На паузе","warning"],finished:["Завершено","neutral"],cancelled:["Остановлено","neutral"]};
function schedTimeline(x){
  const day=864e5,start=new Date(x.created_at).getTime();
  const passed=(x.runs_created||0)+(x.runs_skipped||0),rpd=x.runs_per_day;
  const cur=isNaN(start)?Math.floor(passed/rpd):Math.floor((Date.now()-start)/day);
  let cells="";
  for(let d=0;d<x.duration_days;d++){
    const cls=d<cur||x.status==="finished"?"past":d===cur&&(x.status==="active"||x.status==="paused")?"now":"";
    const dots=Array.from({length:Math.min(rpd,12)},(_,k)=>`<i class="${d*rpd+k<passed?"on":""}"></i>`).join("");
    cells+=`<div class="sch-d ${cls}" title="День ${d+1}: ${rpd} ${plural(rpd,"запуск","запуска","запусков")}"><b>${d+1}</b><span class="dots">${dots}</span></div>`;
  }
  const dayNo=Math.min(x.duration_days,Math.max(1,cur+1));
  return `<div class="sch-tl" role="img" aria-label="Таймлайн расписания по дням">${cells}</div><div class="sch-tlc">${x.status==="active"||x.status==="paused"?"День "+dayNo+" из "+x.duration_days+" · ":""}точки — слоты запусков за день, зелёные уже прошли</div>`;
}

/* Считаем по уже загруженным последним креативам (captured_at) — без доп. запросов к бэкенду. */
function dailyTrend(items,days){
  const now=new Date(),buckets=[];
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);buckets.push({key:d.toISOString().slice(0,10),label:d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}),n:0})}
  const byKey={};buckets.forEach(b=>byKey[b.key]=b);
  (items||[]).forEach(c=>{const k=(c.captured_at||"").slice(0,10),b=byKey[k];if(b)b.n++});
  return{labels:buckets.map(b=>b.label),values:buckets.map(b=>b.n)};
}
function periodDelta(items,days){
  const now=Date.now(),cur=now-days*864e5,prev=now-2*days*864e5;let a=0,b=0;
  (items||[]).forEach(c=>{const t=new Date(c.captured_at||0).getTime();if(!t)return;if(t>=cur)a++;else if(t>=prev)b++});
  if(!b)return{value:a,delta:"",trend:"flat"};
  const pct=Math.round((a-b)/b*100);
  return{value:a,delta:Math.abs(pct)+"%",trend:pct>0?"up":pct<0?"down":"flat"};
}

/* Подключение Click.ru = API-токен + вход в веб-кабинет (логин/пароль).
   Кабинет нужен для шага, которого нет в API Click.ru: подключение Яндекс ID
   из пула как Директ-интеграции. Вход выполняет Chrome на стороне ParsYa,
   cookies сессии хранятся зашифрованными у подключения (addAvto). Пароль и
   cookies в ЛК никогда не возвращаются. */
const CLICKRU_WEB={ok:["connected","Вход в кабинет выполнен","success"],relogin_required:["attention","Нужен повторный вход","warning"],failed:["failed","Вход в кабинет не удался","danger"],none:["attention","Нет входа в кабинет","warning"]};
function clickruWeb(c){return CLICKRU_WEB[c&&c.web_status]||CLICKRU_WEB.none}
function clickruToast(c){
  if(!c)return;
  if(c.web_status==="ok")toast("Click.ru «"+c.label+"»: вход в кабинет выполнен",{tone:"success"});
  else if(c.web_status==="failed")toast("Вход в кабинет «"+c.label+"» не удался: "+(c.web_status_message||"проверьте логин и пароль"),{tone:"danger"});
  else if(c.web_status_message)toast("«"+c.label+"»: "+c.web_status_message,{tone:"warning"});
  else toast("Подключение «"+c.label+"» добавлено. Укажите логин и пароль кабинета — без них нельзя создавать аккаунты.",{tone:"warning"});
}
/* existing — сменить логин/пароль кабинета у уже созданного подключения. */
function clickruDlg(existing,onDone){
  const edit=!!existing;
  const web=`<nv-input name="web_username" label="Логин кабинета Click.ru" value="${esc(edit?existing.web_username||"":"")}" autocomplete="username" ${edit?"required":""}></nv-input>
    <nv-password-input name="web_password" label="Пароль кабинета Click.ru" ${edit?"required":""}></nv-password-input>
    <p class="muted" style="font-size:12px;margin:2px 0 0">Нужны, чтобы подключать аккаунты из пула к Click.ru — в API этого нет. Вход выполнит браузер на сервере ParsYa, сессия сохранится зашифрованной. Займёт до минуты.</p>`;
  overlay("modal",{title:edit?"Вход в кабинет «"+existing.label+"»":"Подключить Click.ru",
    subtitle:edit?"Новые логин и пароль заменят сохранённые":"API-токен и вход в веб-кабинет Click.ru",size:"md",
    body:edit?web:`<nv-input name="label" label="Название подключения" required></nv-input>
    <nv-input name="token" label="API-токен Click.ru" required></nv-input>
    <nv-input name="user_id" label="User ID (необязательно)"></nv-input>${web}`,
    actions:[{label:"Отмена"},{label:edit?"Сохранить и войти":"Подключить",variant:"primary",icon:"link",fn(r,close){
      const v=formVals(r),btn=r.querySelector(".dlg-f nv-button:last-child");
      const user=(v.web_username||"").trim(),pass=v.web_password||"";
      const bad=(n,t)=>{r.querySelector(`[name="${n}"]`).setAttribute("error",t);return false};
      if(!edit){
        if(!(v.label||"").trim())return bad("label","Введите название");
        if(!(v.token||"").trim())return bad("token","Введите токен");
      }
      if(edit||user||pass){
        if(!user)return bad("web_username","Введите логин кабинета");
        if(!pass)return bad("web_password","Введите пароль кабинета");
      }
      btn.setAttribute("loading","");
      (async()=>{
        try{
          const c=edit
            ?await apiPut("/api/v1/ads/clickru-connections/"+existing.id+"/web-credentials",{web_username:user,web_password:pass})
            :await apiPost("/api/v1/ads/clickru-connections",{label:v.label.trim(),token:v.token.trim(),user_id:(v.user_id||"").trim(),web_username:user,web_password:pass});
          await loadClickru();close();clickruToast(c);onDone&&onDone(c);
        }catch(err){btn.removeAttribute("loading");toast((edit?"Не удалось сохранить: ":"Не удалось подключить: ")+(err.message||""),{tone:"danger"})}
      })();
      return false;
    }}]});
}
/* Визард массового запуска: 5 шагов, как в собственном ЛК addAvto
   (Проект → Аккаунт Click.ru → Юрлицо → Количество → Креативы) — объединяет
   создание/редактирование проекта и сам запуск в один поток, вместо двух
   отдельных диалогов. */
function normalizeDomain(raw){
  let d=(raw||"").trim();
  if(d&&!/^https?:\/\//i.test(d))d="https://"+d;
  return d;
}
function resolveRegionIds(raw,geoRegions){
  const names=(raw||"").split(",").map(x=>x.trim()).filter(Boolean);
  const ids=[],unresolved=[];
  for(const n of names){
    if(/^\d+$/.test(n)){ids.push(+n);continue}
    const hit=(geoRegions||[]).find(r=>(r.name||"").toLowerCase()===n.toLowerCase());
    if(hit)ids.push(hit.id);else unresolved.push(n);
  }
  return{ids:[...new Set(ids)],unresolved};
}
function projectWizard(existingProject){

    count:1,creativeMode:"shuffle",adsPerGroup:1,
    // после создания: пополнение с Click.ru (₽ с НДС) и автозапуск (2026-11-12)

  /* Справочник Яндекс.Директа (Dictionaries.get GeoRegions) — дерево
     «регион → города» для nv-tree-select; в region_ids уходят id Яндекса.

  function regionsField(){

  function buildPayerPayload(type,v){
    const p={type,inn:(v.inn||"").trim(),phone:(v.phone||"").trim()||null};
    if(type==="PERSON"){p.last_name=(v.last_name||"").trim();p.first_name=(v.first_name||"").trim();p.middle_name=(v.middle_name||"").trim();return p}
    p.name=(v.name||"").trim();p.tax_form=v.tax_form||"OSN";
    p.business_address={address:(v.business_address||"").trim(),postal_code:(v.business_postal||"").trim()};
    p.actual_address={address:(v.actual_address||"").trim(),postal_code:(v.actual_postal||"").trim()};
    p.bank={name:(v.bank_name||"").trim(),rcbic:(v.bank_rcbic||"").trim(),account:(v.bank_account||"").trim(),correspondent_account:(v.bank_corr||"").trim()};
    if(type==="BUSINESS"){p.full_name=(v.full_name||"").trim();p.kpp=(v.kpp||"").trim();p.ogrn=+v.ogrn||null}
    else p.ogrnip=+v.ogrnip||null;
    return p;

// Отображаемая ссылка (TextAd.DisplayUrlPath): до 20 символов (# шаблона не
// считается), буквы, цифры и - № / % #; нельзя пробел, _, -- и //.
function displayUrlError(v){v=(v||"").trim();if(!v)return "";
  if(v.replace(/#/g,"").length>20)return "Не больше 20 символов";
  if(/[\s_]/.test(v))return "Нельзя пробел и _";
  if(/--|\/\//.test(v))return "Нельзя -- и //";
  if(!/^[\p{L}\p{N}\-№\/%#]+$/u.test(v))return "Только буквы, цифры и - № / % #";
  return ""}
function displayUrlField(value,label){return `<nv-input name="display_url" label="${esc(label)}" value="${esc(value||"")}" placeholder="например: santa-klaus/kupit" style="margin-top:8px"></nv-input><div class="muted" data-durl-msg style="font-size:12px;margin-top:2px"></div>`}
function mountDisplayUrl(root,onChange){const i=root.querySelector('nv-input[name="display_url"]'),m=root.querySelector("[data-durl-msg]");if(!i)return;
  const upd=v=>{const e=displayUrlError(v),n=(v||"").replace(/#/g,"").trim().length;m.textContent=e||`${n}/20 — пусто: Директ покажет домен`;m.style.color=e?"var(--bad)":"";onChange&&onChange(v)};
  upd(i.getAttribute("value")||"");i.addEventListener("nv-change",e=>upd(e.detail.value))}
function buttonActionOptions(none="Без кнопки"){return ["NONE:"+none,...BUTTON_ACTIONS.map(([v,l])=>v+":"+l)].join("|")}

// «Пополнить и запустить» для уже созданных кампаний (2026-11-12). Реальные
// деньги: сумма и количество аккаунтов показываются до нажатия.
function fundAndStartDialog(p,acc,redraw){
  overlay("modal",{title:"Пополнить и запустить",
    body:`<p class="muted" style="font-size:13px">Кампаний в проекте: ${acc.length}. Пополнение идёт с баланса Click.ru (юрлицо запуска), сумма с НДС — на КАЖДЫЙ аккаунт; повторное нажатие пополнит ещё раз.</p>
      <nv-input name="amount" label="Пополнить каждый аккаунт, ₽ с НДС (0 — без пополнения)" type="number" value="1220"></nv-input>
      <label class="row" style="gap:8px;margin-top:8px"><input type="checkbox" name="start" checked><span>Запустить показы: модерация объявлений и включение кампаний</span></label>
      <div class="muted" data-fund-total style="font-size:12.5px;margin-top:6px"></div>
      <div data-fund-payers style="margin-top:12px"><p class="muted" style="font-size:12.5px">Загружаю балансы юрлиц Click.ru…</p></div>`,
    mount(r){
      // Балансы юрлиц Click.ru (2026-11-12): все юрлица подключений проекта,
      // юрлицо запуска (с него и спишется) — выделено.
      const used=new Set(acc.map(a=>a.payer_id).filter(Boolean));
      const conns=[...new Set(acc.map(a=>a.connection_id).filter(Boolean))];
      let payers=[];
      const fmt=n=>(+n||0).toLocaleString("ru-RU",{maximumFractionDigits:2});
      const upd=()=>{const a=Math.max(0,+(formVals(r).amount||0)),need=acc.length*a;
        r.querySelector("[data-fund-total]").textContent=a>0?`Всего спишется: ${acc.length} × ${a.toLocaleString("ru-RU")} = ${need.toLocaleString("ru-RU")} ₽ с НДС.`:"Без пополнения.";
        const host=r.querySelector("[data-fund-payers]");if(!payers.length)return;
        host.innerHTML=`<div style="font-size:12.5px;font-weight:600;margin-bottom:6px">Балансы юрлиц Click.ru</div><div class="stack">${payers.map(p=>{
          const sel=used.has(p.id),bal=typeof p.balance==="number"?p.balance:null,low=sel&&a>0&&bal!==null&&bal<need;
          return `<div class="row" style="gap:10px;justify-content:space-between;padding:9px 11px;border-radius:10px;border:${sel?"2px solid var(--accent,#3b6cff)":"1px solid var(--line)"};${sel?"background:color-mix(in srgb,var(--accent,#3b6cff) 8%,transparent)":""}">
            <span style="min-width:0"><b>${esc(payerLabel(p))}</b>${sel?' <span style="font-size:11.5px;color:var(--accent,#3b6cff);font-weight:600">· юрлицо запуска, спишется с него</span>':""}${p._conn&&conns.length>1?`<br><span class="muted" style="font-size:12px">подключение #${p._conn}</span>`:""}</span>
            <span style="white-space:nowrap;font-weight:${sel?700:500};${low?"color:var(--bad)":""}">${bal===null?"—":fmt(bal)+" ₽"}</span></div>${low?`<div style="font-size:12px;color:var(--bad);margin:-2px 0 4px">Не хватает ${fmt(need-bal)} ₽ — часть аккаунтов не пополнится</div>`:""}`}).join("")}</div>
          ${used.size?"":`<p class="muted" style="font-size:12px;margin-top:6px">У кампаний проекта не записано юрлицо — пополнение пойдёт с физлица (payerId 0).</p>`}`};
      upd();const i=r.querySelector('nv-input[name="amount"]');if(i)i.addEventListener("nv-change",upd);
      (async()=>{
        const seen=new Set();
        for(const c of (conns.length?conns:[null])){
          try{const d=await api("/api/v1/ads/payers",c?{connection_id:c}:{});
            (d.items||[]).forEach(p=>{if(!seen.has(p.id)){seen.add(p.id);payers.push({...p,_conn:c})}})}catch(e){}
        }
        payers.sort((x,y)=>(used.has(y.id)-used.has(x.id))||((+y.balance||0)-(+x.balance||0)));
        if(!payers.length)r.querySelector("[data-fund-payers]").innerHTML='<p class="muted" style="font-size:12.5px">Не удалось получить балансы юрлиц Click.ru.</p>';
        else upd();
      })();
    },
    actions:[{label:"Отмена"},{label:"Выполнить",variant:"primary",fn(r,close){
      const amount=Math.max(0,+(formVals(r).amount||0)),start=!!(r.querySelector('input[name="start"]')||{}).checked;
      if(!amount&&!start){toast("Укажите сумму или отметьте запуск",{tone:"warning"});return false}
      (async()=>{
        try{
          const res=await apiPost("/api/v1/ads/projects/"+p.id+"/fund-and-start",{amount_rub:amount,start});
          toast(`Готово: пополнено ${res.funded} из ${res.total}${start?", запущено "+res.started:""}`,{tone:res.funded===res.total||!amount?"success":"warning"});
          close();redraw&&redraw();loadProjects();
        }catch(err){toast(err.message||"Не удалось",{tone:"danger"})}
      })();
      return false;
    }}]});

const PROJ_STATUS={draft:["Черновик",""],generating:["Генерация","info"],running:["Идёт запуск","info"],launched:["Запущен","success"],failed:["Ошибка запуска","danger"]};
function projStatus(p){
  const s=p.stats||{};
  if(s.running_job_id)return"running";
  if(s.ozon_running)return"generating";
  if(!s.jobs_count)return"draft";
  return s.last_job_status==="failed"?"failed":"launched";
}
function projPayerNames(p){

}
const PROJ_F_KEY="parsya_ads_proj_filter";
function projFilter(){
  if(!S.ads.projF){let f={};try{f=JSON.parse(localStorage.getItem(PROJ_F_KEY)||"{}")}catch(e){}S.ads.projF={q:"",mode:"",status:"",payer:"",conn:"",camps:"",period:"",sort:"recent",...f}}
  return S.ads.projF;
}
function filteredProjects(){
  const f=projFilter(),q=(f.q||"").trim().toLowerCase();
  const modes=(f.mode||"").split(",").filter(Boolean),stats=(f.status||"").split(",").filter(Boolean),payers=(f.payer||"").split(",").filter(Boolean),conns=(f.conn||"").split(",").filter(Boolean);
  const rows=(S.ads.projects||[]).filter(p=>{
    if(q&&!((p.name||"")+" "+(p.domain||"")+" "+(p.ozon_url||"")).toLowerCase().includes(q))return false;
    if(modes.length&&!modes.includes(p.launch_mode==="ozon"?"ozon":"direct"))return false;
    if(stats.length&&!stats.includes(projStatus(p)))return false;
    if(payers.length&&!((p.stats||{}).payer_ids||[]).some(id=>payers.includes(String(id))))return false;
    if(conns.length&&!((p.stats||{}).connection_ids||[]).some(id=>conns.includes(String(id))))return false;
    if(f.camps==="yes"&&!(p.stats||{}).campaigns_count)return false;
    if(f.camps==="no"&&(p.stats||{}).campaigns_count)return false;
    if(f.period&&f.period!=="all"&&(String(f.period).includes("..")||+f.period>0)){const [a,b]=String(f.period).includes("..")?f.period.split(".."):[new Date(Date.now()-(+f.period||0)*864e5).toISOString().slice(0,10),""];
      const c=(p.created_at||"").slice(0,10);if(a&&c<a)return false;if(b&&c>b)return false}
    return true;
  });
  const t=p=>(p.stats&&p.stats.last_job_at)||p.updated_at||p.created_at||"";
  const sorters={recent:(a,b)=>t(b).localeCompare(t(a)),created:(a,b)=>(b.created_at||"").localeCompare(a.created_at||""),
    name:(a,b)=>(a.name||"").localeCompare(b.name||"","ru"),campaigns:(a,b)=>((b.stats||{}).campaigns_count||0)-((a.stats||{}).campaigns_count||0)};
  return rows.sort(sorters[f.sort]||sorters.recent);
}

N.acts.adsCheckClickru=(a,d)=>{
  const c=S.ads.clickru.find(x=>String(x.id)===String(d.id));if(!c)return;
  const b=a&&a.closest?a.closest("nv-button"):null;b&&b.setAttribute("loading","");
  toast("Проверяю вход в кабинет «"+c.label+"»…");
  (async()=>{try{const r=await apiPost("/api/v1/ads/clickru-connections/"+c.id+"/web-check",{});await loadClickru();clickruToast(r)}catch(err){b&&b.removeAttribute("loading");toast("Не удалось проверить вход: "+(err.message||""),{tone:"danger"})}})();

function fileToDataUrl(file,maxDim){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      if(w>maxDim||h>maxDim){const k=maxDim/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve({dataUrl:c.toDataURL("image/jpeg",0.88),naturalW:img.naturalWidth,naturalH:img.naturalHeight});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Не удалось прочитать изображение"))};
    img.src=url;
  });
}
function studioLoadImg(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
async function studioUrlToDataUrl(url,maxDim){const resp=await fetch(url,{mode:"cors"});if(!resp.ok)throw new Error("fetch failed");return await fileToDataUrl(await resp.blob(),maxDim)}
function studioIconDataUrl(name,color){
  /* iconSvg()'s markup is written to be innerHTML'd into an existing document, where the
     HTML parser recognizes <svg> implicitly — it has no xmlns, which a standalone
     data:image/svg+xml resource (decoded by the image loader, not the HTML parser) needs
     explicitly or the load silently fails. */
  const svg=iconSvg(name).replace('stroke="currentColor"',`stroke="${color}"`).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" ');
  return"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
async function studioRenderCanvas(design,scale){
  const fmt=STUDIO_FMT[design.format],W=Math.round(fmt.w*(scale||1)),H=Math.round(fmt.h*(scale||1));
  const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
  if(design.bg.type==="image"&&design.bg.image){try{const img=await studioLoadImg(design.bg.image);ctx.drawImage(img,0,0,W,H)}catch(e){ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H)}}
  else{ctx.fillStyle=design.bg.color||"#fff";ctx.fillRect(0,0,W,H)}
  for(const l of design.layers){
    const x=l.x/100*W,y=l.y/100*H,w=l.w/100*W,h=l.h/100*H;
    ctx.save();
    ctx.globalCompositeOperation=l.blendMode&&l.blendMode!=="normal"?l.blendMode:"source-over";
    ctx.globalAlpha=studioOpacityOf(l)/100;
    {const cx=x+w/2,cy=y+h/2;ctx.translate(cx,cy);ctx.rotate((l.rotation||0)*Math.PI/180);ctx.scale(l.flipH?-1:1,l.flipV?-1:1);ctx.transform(1,Math.tan((l.skewY||0)*Math.PI/180),Math.tan((l.skewX||0)*Math.PI/180),1,0,0);ctx.translate(-cx,-cy)}
    if(l.type==="shape"){
      const f=studioFillOf(l),s=studioStrokeOf(l);
      ctx.fillStyle=f.type==="none"?"transparent":f.type==="gradient"?(()=>{const g=studioGradLine(x,y,w,h,f.angle||90);const gr=ctx.createLinearGradient(g.x0,g.y0,g.x1,g.y1);gr.addColorStop(0,f.color);gr.addColorStop(1,f.color2);return gr})():f.type==="radial"?(()=>{const gr=ctx.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)/2);gr.addColorStop(0,f.color);gr.addColorStop(1,f.color2);return gr})():f.color;
      ctx.beginPath();
      if(l.shape==="ellipse")ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);
      else if(l.shape==="triangle"){ctx.moveTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath()}
      else if(l.shape==="polygon"||l.shape==="star"){
        studioPolyPoints(l.sides,l.shape==="star"?l.innerRadius:null).forEach((p,i)=>{const px=x+p.x/100*w,py=y+p.y/100*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)});
        ctx.closePath();
      }
      else{const r=Math.min((l.radius||0)*(scale||1),w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
      if(f.type!=="none")ctx.fill();
      if(s.enabled){ctx.strokeStyle=s.color;ctx.lineWidth=s.width*(scale||1);ctx.setLineDash(studioDashArr(s.dash,scale).split(",").filter(Boolean).map(Number));ctx.stroke()}
    }else if(l.type==="path"){
      const f=studioFillOf(l),s=studioStrokeOf(l),pts=l.points||[];
      if(pts.length>1){
        ctx.beginPath();
        const toPx=p=>({x:x+p.x/100*w,y:y+p.y/100*h});
        const a0=toPx(pts[0]);ctx.moveTo(a0.x,a0.y);
        for(let i=1;i<pts.length;i++){
          const p0=pts[i-1],p1=pts[i],a=toPx(p0),b=toPx(p1);
          const c1=p0.out?toPx({x:p0.x+p0.out.dx,y:p0.y+p0.out.dy}):a;
          const c2=p1.in?toPx({x:p1.x+p1.in.dx,y:p1.y+p1.in.dy}):b;
          ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,b.x,b.y);
        }
        if(l.closed){
          const p0=pts[pts.length-1],p1=pts[0],a=toPx(p0),b=toPx(p1);
          const c1=p0.out?toPx({x:p0.x+p0.out.dx,y:p0.y+p0.out.dy}):a;
          const c2=p1.in?toPx({x:p1.x+p1.in.dx,y:p1.y+p1.in.dy}):b;
          ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,b.x,b.y);ctx.closePath();
        }
        if(f.type!=="none"){ctx.fillStyle=f.type==="gradient"?(()=>{const g=studioGradLine(x,y,w,h,f.angle||90);const gr=ctx.createLinearGradient(g.x0,g.y0,g.x1,g.y1);gr.addColorStop(0,f.color);gr.addColorStop(1,f.color2);return gr})():f.type==="radial"?(()=>{const gr=ctx.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)/2);gr.addColorStop(0,f.color);gr.addColorStop(1,f.color2);return gr})():f.color;ctx.fill()}
        if(s.enabled){ctx.strokeStyle=s.color;ctx.lineWidth=s.width*(scale||1);ctx.setLineDash(studioDashArr(s.dash,scale).split(",").filter(Boolean).map(Number));ctx.stroke()}
      }
    }else if(l.type==="icon"){
      try{const img=await studioLoadImg(studioIconDataUrl(l.icon||"star",l.color));ctx.drawImage(img,x,y,w,h)}catch(e){}
    }else if(l.type==="image"&&l.src){
      try{const img=await studioLoadImg(l.src);ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
        const ir=img.naturalWidth/img.naturalHeight,br=w/h;let baseW=w,baseH=h;
        if(ir>br){baseH=h;baseW=h*ir}else{baseW=w;baseH=w/ir}
        const zoom=l.zoom||1,dw=baseW*zoom,dh=baseH*zoom,fx=(l.fx==null?50:l.fx)/100,fy=(l.fy==null?50:l.fy)/100;
        const dx=x-(dw-w)*fx,dy=y-(dh-h)*fy;
        ctx.drawImage(img,dx,dy,dw,dh)}catch(e){}
    }else if(l.type==="text"){
      const cx=x+w/2,cy=y+h/2;let x2=x,y2=y,w2=w,h2=h;
      if(l.vertical){ctx.translate(cx,cy);ctx.rotate(Math.PI/2);ctx.translate(-cx,-cy);x2=cx-h/2;y2=cy-w/2;w2=h;h2=w}
      const fs=Math.max(8,H*l.fontSize/100);
      ctx.fillStyle=l.color;ctx.font=`${l.weight==="700"?"700":"400"} ${fs}px var(--font-display),Arial,sans-serif`;
      ctx.textBaseline="middle";ctx.textAlign=l.align==="center"?"center":l.align==="right"?"right":"left";
      const tx=l.align==="center"?x2+w2/2:l.align==="right"?x2+w2:x2;
      const words=(l.text||"").split(/\s+/),lines=[];let cur="";
      for(const word of words){const test=cur?cur+" "+word:word;if(ctx.measureText(test).width>w2&&cur){lines.push(cur);cur=word}else cur=test}
      if(cur)lines.push(cur);
      const lh=fs*1.18,totalH=lh*lines.length,startY=y2+h2/2-totalH/2+lh/2;
      lines.forEach((ln,i)=>ctx.fillText(ln,tx,startY+i*lh));
    }
    ctx.restore();
  }
  return c;
}
async function studioExportPng(){

}

function studioPenFinish(closed){
  const draft=studioPenDraft;studioPenDraft=null;studioDrag=null;
  if(!draft||draft.points.length<2){N.refresh();return}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  draft.points.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY);
  const pts=draft.points.map(p=>({
    x:(p.x-minX)/bw*100,y:(p.y-minY)/bh*100,type:p.type,
    out:p.out?{dx:p.out.dx/bw*100,dy:p.out.dy/bh*100}:null,
    in:p.in?{dx:p.in.dx/bw*100,dy:p.in.dy/bh*100}:null,
  }));
  const l=studioLayerDefaults("path");
  Object.assign(l,{x:minX,y:minY,w:bw,h:bh,points:pts,closed:!!closed});
  studioDesign().layers.push(l);studioDesign().selectedId=l.id;
  studioTool="select";
  N.refresh();NEON.save();

async function studioEyedrop(xPct,yPct){
  const d=studioDesign();
  let hex="#000000";
  try{
    const c=await studioRenderCanvas(d,1),ctx=c.getContext("2d");
    const px=Math.min(c.width-1,Math.max(0,Math.round(xPct/100*c.width))),py=Math.min(c.height-1,Math.max(0,Math.round(yPct/100*c.height)));
    const[r,g,b]=ctx.getImageData(px,py,1,1).data;
    hex="#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
  }catch(e){toast("Не удалось взять цвет",{tone:"danger"});return}
  const l=studioSelected();
  if(l&&(l.type==="shape"||l.type==="path")){studioBeforeChange();l.fill=l.fill?{...l.fill,color:hex}:studioDefFill(hex);studioPatchLayerDom(l);studioRenderSidebar(document);NEON.save();toast("Цвет "+hex+" применён к заливке",{tone:"success"})}
  else if(l&&(l.type==="text"||l.type==="icon")){studioBeforeChange();l.color=hex;studioPatchLayerDom(l);studioRenderSidebar(document);NEON.save();toast("Цвет "+hex+" применён",{tone:"success"})}
  else toast("Цвет: "+hex+" (выберите слой, чтобы применить)");
}
function studioAlign(dir){
  const d=studioDesign(),boxes=studioMultiSel.map(id=>d.layers.find(x=>x.id===id)).filter(Boolean);
  if(boxes.length<2)return;
  const minX=Math.min(...boxes.map(b=>b.x)),maxX=Math.max(...boxes.map(b=>b.x+b.w));
  const minY=Math.min(...boxes.map(b=>b.y)),maxY=Math.max(...boxes.map(b=>b.y+b.h));
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  boxes.forEach(b=>{
    if(dir==="left")b.x=minX;else if(dir==="right")b.x=maxX-b.w;else if(dir==="ch")b.x=cx-b.w/2;
    else if(dir==="top")b.y=minY;else if(dir==="bottom")b.y=maxY-b.h;else if(dir==="cv")b.y=cy-b.h/2;
  });
  boxes.forEach(studioPatchLayerDom);
}
function studioDistribute(dir){
  const d=studioDesign();let boxes=studioMultiSel.map(id=>d.layers.find(x=>x.id===id)).filter(Boolean);
  if(boxes.length<3)return;
  if(dir==="h"){
    boxes=boxes.slice().sort((a,b)=>a.x-b.x);
    const first=boxes[0],last=boxes[boxes.length-1],span=(last.x+last.w)-first.x,sumW=boxes.reduce((s,b)=>s+b.w,0),gap=(span-sumW)/(boxes.length-1);
    let runX=first.x;
    boxes.forEach((b,i)=>{if(i>0&&i<boxes.length-1)b.x=runX+gap;runX=b.x+b.w+gap});
  }else{
    boxes=boxes.slice().sort((a,b)=>a.y-b.y);
    const first=boxes[0],last=boxes[boxes.length-1],span=(last.y+last.h)-first.y,sumH=boxes.reduce((s,b)=>s+b.h,0),gap=(span-sumH)/(boxes.length-1);
    let runY=first.y;
    boxes.forEach((b,i)=>{if(i>0&&i<boxes.length-1)b.y=runY+gap;runY=b.y+b.h+gap});
  }
  boxes.forEach(studioPatchLayerDom);
}

  if((e.key==="Delete"||e.key==="Backspace")&&studioEditingPathId&&studioEditingPointIndex!=null&&!typing){studioPointDelete();e.preventDefault();return}
  if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==="z"){e.preventDefault();if(e.shiftKey)studioRedo();else studioUndo();return}
  if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==="y"){e.preventDefault();studioRedo();return}
});
Object.assign(N.chg,{
  studName(v){studioDesign().name=v;NEON.save()},
  studFormat(v){studioDesign().format=v;N.refresh();NEON.save()}
});
Object.assign(N.acts,{
  studAdd(a,d){studioBeforeChange();const l=studioLayerDefaults(d.type,d.shape);studioDesign().layers.push(l);studioDesign().selectedId=l.id;studioMultiSel=[];N.refresh();NEON.save()},
  studSave:studioSaveDesign,
  studExport:studioExportPng,
  studTool(a,d){studioPenDraft=null;studioEditingPathId=null;studioEditingPointIndex=null;studioTool=studioTool===d.tool?"select":d.tool;N.refresh()},
  studUndo:studioUndo,
  studRedo:studioRedo,
  studEditPts(){const l=studioSelected();if(!l||l.type!=="path")return;studioEditingPathId=studioEditingPathId===l.id?null:l.id;studioEditingPointIndex=null;N.refresh()},
  studNew(){studioResetEphemeral();S.studio.editor=studioNewDesign();N.go("studio-editor")},
  studOpen(a,d){const x=S.studio.designs.find(y=>y.id===d.id);if(x){studioResetEphemeral();S.studio.editor=JSON.parse(JSON.stringify(x));S.studio.editor.selectedId=null;N.go("studio-editor")}},
  studDel(a,d){confirm({title:"Удалить дизайн?",text:"Это действие нельзя отменить.",confirm:"Удалить",danger:true,fn(){const i=S.studio.designs.findIndex(x=>x.id===d.id);if(i>=0)S.studio.designs.splice(i,1);N.refresh();NEON.save();toast("Дизайн удалён")}})},
  studBgClear(){studioBeforeChange();studioDesign().bg={type:"color",color:studioDesign().bg.color||"#ffffff"};N.refresh();NEON.save()},
  async studFromCreative(a,d){
    const g=findGroup(d.id);
    if(!g){toast("Креатив не найден",{tone:"warning"});return}
    const rep=g.representative,design=studioNewDesign();
    design.name=(rep.title||"Новый дизайн").slice(0,60);
    if(rep.image_url){
      try{const{dataUrl}=await studioUrlToDataUrl(rep.image_url,1600);design.bg={type:"image",image:dataUrl}}
      catch(e){design.bg={type:"image",image:rep.image_url}}
    }
    if(rep.title){const l=studioLayerDefaults("text");Object.assign(l,{text:rep.title,y:72,h:16,fontSize:6,color:"#ffffff",weight:"800"});design.layers.push(l)}
    studioResetEphemeral();S.studio.editor=design;N.go("studio-editor");NEON.save();
    toast("Дизайн создан из креатива",{tone:"success"});
  }
});
document.body.addEventListener("mousedown",e=>{if(e.target.closest("[data-act-bg-color]"))studioBeforeChange()},true);
document.body.addEventListener("nv-change",e=>{
  if(e.target.matches("[data-act-bg-color]")){studioDesign().bg={type:"color",color:e.detail.value};const stage=document.querySelector(".stud-stage");if(stage&&studioDesign().bg.type==="color")stage.style.background=e.detail.value;NEON.save()}
});
N.register({id:"studio",name:"Студия креативов",short:"Студия",tag:"Creative Studio",icon:"palette",rail:"main",status:"ready",
  desc:"Собирайте рекламные креативы на холсте: текст, картинки, фигуры",
  metric:()=>(S.studio.designs.length||0)+" дизайна сохранено",
  nav:[{items:[
    {id:"editor",label:"Редактор",icon:"square-pen"},
    {id:"library",label:"Мои дизайны",icon:"images",count:()=>S.studio.designs.length||""}
  ]}],
  views:views_studio,seed:studioSeed,
  commands:[{label:"Новый дизайн",icon:"plus",run(){N.acts.studNew()}}]});

NEON.loadNotifications();
NEON.loadProfile();
NEON.start();
})();
</script>
</body></html>
