.sch-d b{font:500 10.5px var(--font-mono);color:var(--ink-3)}

<title>ParsYa Ads — Разведка рекламы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=optional">
<style>
/* NEON UI: единые токены и стили компонентов для всех сервисов бренда.
   Макет: тёмный рельс сервисов + меню сервиса + рабочая область с мягкими карточками.
   Цвет сервиса задаётся атрибутом data-svc, остальное общее. */
:root{
  --font-display:"Onest","Segoe UI",system-ui,sans-serif;
  --font-body:"Onest","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --bg:#f3f5f2;--surface:#ffffff;--surface-2:#eff2ee;--surface-3:#e5e9e4;--line:#e0e4de;--line-2:#c9cfc7;
  --ink:#14181a;--ink-2:#485053;--ink-3:#667074;
  --rail:#111416;--rail-2:#1d2225;--rail-ink:#f1f4f1;--rail-ink-2:#9fa8a8;
  --on-svc:#0d1211;
  --ok:#0f7b45;--ok-bg:#dff5e8;--warn:#8f5b00;--warn-bg:#fdf0d3;--bad:#c02c2c;--bad-bg:#fde6e4;--info:#1d62b8;--info-bg:#e1edfb;
  --chart-1:#2a78d6;--chart-2:#eb6834;--chart-3:#1baf7a;--chart-4:#eda100;
  --shadow-1:0 1px 2px rgba(17,24,20,.06),0 0 0 1px rgba(17,24,20,.04);--shadow-2:0 10px 30px rgba(17,24,20,.13);--scrim:rgba(14,18,16,.46);
  --l0:var(--surface-3);--l1:var(--bg);--l2:var(--surface);--tl:var(--surface);--td:transparent;
  --r-s:6px;--r-m:10px;--r-l:16px;
  --art-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1113;--surface:#171b1e;--surface-2:#1f2427;--surface-3:#2a3034;--line:#2a3034;--line-2:#3c4448;
  --ink:#eef1ee;--ink-2:#b5bdbd;--ink-3:#8f999a;
  --ok:#55d690;--ok-bg:#12352a;--warn:#f0b64e;--warn-bg:#3a2c10;--bad:#ff8a84;--bad-bg:#42191a;--info:#7db4f5;--info-bg:#15304f;
  --chart-1:#3987e5;--chart-2:#d95926;--chart-3:#199e70;--chart-4:#c98500;
  --l0:var(--bg);--l1:var(--surface);--l2:var(--surface-2);--tl:transparent;--td:var(--surface-3);
  --shadow-1:0 0 0 1px rgba(255,255,255,.04);--shadow-2:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1113;--surface:#171b1e;--surface-2:#1f2427;--surface-3:#2a3034;--line:#2a3034;--line-2:#3c4448;
  --ink:#eef1ee;--ink-2:#b5bdbd;--ink-3:#8f999a;
  --ok:#55d690;--ok-bg:#12352a;--warn:#f0b64e;--warn-bg:#3a2c10;--bad:#ff8a84;--bad-bg:#42191a;--info:#7db4f5;--info-bg:#15304f;
  --chart-1:#3987e5;--chart-2:#d95926;--chart-3:#199e70;--chart-4:#c98500;
  --l0:var(--bg);--l1:var(--surface);--l2:var(--surface-2);--tl:transparent;--td:var(--surface-3);
  --shadow-1:0 0 0 1px rgba(255,255,255,.04);--shadow-2:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}

/* Цвет сервиса: --svc для заливок, --svc-d для текста на светлом фоне */
[data-svc]{--svc:#39ff88;--svc-d:#0c7a42;--svc-ink:var(--svc-d);--svc-soft:color-mix(in srgb,var(--svc) 20%,transparent)}
[data-svc="launch"]{--svc:#ffb224;--svc-d:#8f5a06}
[data-svc="studio"]{--svc:#c4a7ff;--svc-d:#6a3fd4}
[data-svc="connect"]{--svc:#5fd4ff;--svc-d:#0a6a90}
[data-svc="sites"]{--svc:#ff9a76;--svc-d:#b3411a}
[data-svc="crm"]{--svc:#ff8fcb;--svc-d:#ad226b}
[data-svc="seo"]{--svc:#c8f03c;--svc-d:#566b05}
[data-svc="mail"]{--svc:#8fb4ff;--svc-d:#2b5cc4}
[data-svc="bots"]{--svc:#7ef0d8;--svc-d:#0a7562}
[data-svc="calls"]{--svc:#ffd86b;--svc-d:#7f6400}
[data-svc="bi"]{--svc:#a5e8ff;--svc-d:#14688a}
[data-svc="kit"]{--svc:#dfe4dd;--svc-d:#3a4144}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-svc]{--svc-ink:var(--svc)}}
:root[data-theme="dark"] [data-svc]{--svc-ink:var(--svc)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:var(--svc-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--font-mono);font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nv-icon{display:inline-flex;flex:none;line-height:0}
nv-icon svg{width:1em;height:1em;stroke-width:2}

/* ---------- Оболочка ---------- */
#app{height:100%}
.shell{display:grid;grid-template-columns:78px 228px minmax(0,1fr);height:100%;transition:grid-template-columns .15s ease}
.shell.side-collapsed{grid-template-columns:78px 68px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:2px;padding:12px 8px;overflow-y:auto;scrollbar-width:none}
.rail-logo{width:40px;height:40px;margin:0 auto 12px;border-radius:12px;background:#39ff88;color:#0d1211;display:grid;place-items:center;font:800 19px var(--font-display);flex:none;border:0;cursor:pointer}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border:0;background:none;border-radius:10px;color:var(--rail-ink-2);font-size:11px;line-height:1.15;cursor:pointer;text-align:center;flex:none;width:100%;position:relative}
.rail-item nv-icon{font-size:19px}
.rail-item:hover{background:var(--rail-2);color:var(--rail-ink)}
.rail-item.on{background:var(--svc);color:#0d1211;font-weight:600}
.rail-item.soon{opacity:.72}
.rail-item:focus-visible{outline-color:#fff}
.rail-sep{height:1px;background:var(--rail-2);margin:8px 6px;flex:none}
.rail-end{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:2px}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.side-head{padding:16px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.side-head-t{min-width:0}
.side-head h2{font-size:16px;font-weight:800}
.side-head p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.side-search{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:0;color:var(--ink-3);font-size:12.5px;cursor:pointer;text-align:left;flex:none}
.side-search:hover{color:var(--ink)}
.side-search span{flex:1}
.side-search kbd{font:10px var(--font-mono);color:var(--ink-3);background:var(--surface);border-radius:4px;padding:1px 5px;flex:none}
.side-collapsed .side-search{display:none}
.side-group{padding:6px 10px}
.side-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px 4px;font-weight:600}
.side-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;color:var(--ink-2);font-weight:500;cursor:pointer;text-align:left}
.side-item nv-icon{font-size:16px}
.side-item span.t{flex:1;min-width:0}
.side-item:hover{background:var(--surface-2);color:var(--ink)}
.side-item.on{background:var(--svc-soft);color:var(--ink);font-weight:600}
.side-item.on nv-icon{color:var(--svc-ink)}
.side-item.has-kids nv-icon:last-child{margin-left:auto;font-size:14px;color:var(--ink-3)}
.side-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-collapse-btn{flex:none}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12.5px}
.side-foot strong{display:block;font-weight:600}
.side-foot span{color:var(--ink-3)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.top .burger{display:none}
.crumbs{font-size:13px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.scroll{flex:1;overflow-y:auto;min-height:0;scroll-behavior:auto;scrollbar-gutter:stable}
.view{padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.scrim-nav{display:none}
@media (max-width:980px){
  .shell,.shell.has-sub{grid-template-columns:minmax(0,1fr)}

  .rail,.side{position:fixed;top:0;bottom:0;z-index:40;transform:translateX(calc(-100% - 90px));transition:transform .18s ease}
  .rail{left:0;width:78px}
