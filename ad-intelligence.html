.pf,.au{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pf-i{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.pf-t{flex:1 1 200px;min-width:0}
.pf-t h3{font-size:15px;font-weight:500}
.pf-t p{font-size:12px;color:var(--ink-2);margin-bottom:4px;overflow-wrap:anywhere}
.au-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.au-t small{font-size:11.5px;color:var(--ink-3)}
.au-b{width:auto;cursor:pointer}
.nv-btn.au-x{width:auto}
.sr-r{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
nv-settings-row:first-child .sr-r,.card-b>nv-settings-row:first-child .sr-r{border-top:0;padding-top:0}
.sr-t{flex:1 1 180px;min-width:0}
.sr-t b{display:block;font-weight:500;font-size:12.5px}
.sr-t small{display:block;font-size:11.5px;color:var(--ink-3)}
.sr-c{flex:0 1 220px;min-width:0}
.sr-c:has(nv-button),.sr-c:has(nv-switch){flex:none}
.cf{padding-right:4px}
.cf code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:11.5px;scrollbar-width:none}
/* Команда и общее */
.side-foot{margin-top:0}
.ws{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:color-mix(in srgb,var(--l2) 55%,transparent);border-radius:12px;cursor:pointer;text-align:left;color:var(--ink)}
.ws:hover{background:var(--l2)}
.ws-i{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 12px var(--font-display);flex:none}
.ws-t{flex:1;min-width:0}
.ws-t b{display:block;font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-t small{display:block;font-size:10.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws>nv-icon{color:var(--ink-2)}
.pop .ws-i{width:20px;height:20px;border-radius:6px;font-size:10px}
.ws-f .pop-x{display:inline-flex;align-items:center;gap:5px}
.pg{display:inline-flex;align-items:center;gap:2px}
.pg button{min-width:26px;height:26px;border:0;background:none;border-radius:7px;cursor:pointer;font:11.5px var(--font-mono);color:var(--ink-2);display:grid;place-items:center}
.pg button:hover:not(:disabled){background:var(--l2);color:var(--ink)}
.pg button.on{background:var(--ink);color:var(--surface)}
.pg button:disabled{opacity:.35;cursor:not-allowed}
.pg-e{padding:0 3px;color:var(--ink-3)}
.ss .nv-btn{width:auto}
.ph>.ph-actions{max-width:100%;min-width:0}
.ph-actions nv-segmented{max-width:100%;min-width:0}
.bc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.bc button{border:0;background:none;padding:0;cursor:pointer;color:inherit}
.bc button:hover{color:var(--ink);text-decoration:underline}
.bc [aria-current]{color:var(--ink);font-weight:500}
.er{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:40px 14px}
.er-c{font:500 11px var(--font-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.er h3{font-size:19px;font-weight:500;letter-spacing:-.015em}
.er p{color:var(--ink-2);max-width:46ch}
.er-a{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fb{display:flex;flex-direction:column;gap:7px}
.fb b{font-weight:500}
.fb-s{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px}
.fb-s button{height:28px;border:0;background:var(--l2);border-radius:6px;cursor:pointer;font:11px var(--font-mono);color:var(--ink);padding:0}
.fb-s button:hover{background:var(--surface-3)}
.fb-s button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.fb-k{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.fb-ok{flex-direction:row;align-items:center;color:var(--ok)}
.acc-n{display:flex;flex-direction:column;gap:1px}

/* ---------- Студия креативов: canvas-редактор ---------- */
.stud{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:1100px){.stud{grid-template-columns:minmax(0,1fr)}}
.stud-tools{display:flex;flex-direction:column;gap:9px;position:sticky;top:8px}
.stud-tools nv-button,.stud-tools nv-input,.stud-tools nv-segmented{width:100%}
.stud-tools .nv-btn{width:100%;justify-content:flex-start}
.stud-stage-wrap{text-align:center;overflow:auto;max-height:calc(100vh - 150px);padding:4px}
.stud-zoom{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;font-size:12px;color:var(--ink-3)}
.stud-zoom button{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:26px;min-width:26px;padding:0 7px;cursor:pointer;color:var(--ink-2);font-size:12px}
.stud-zoom button.on{border-color:var(--svc-ink);color:var(--svc-ink);background:var(--svc-soft)}
.stud-zones{position:absolute;inset:0;pointer-events:none;z-index:5}
.stud-zones .m{position:absolute;inset:5%;border:1px dashed rgba(255,45,120,.75);border-radius:4px}
.stud-zones .ui{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(255,45,120,.16) 0 8px,rgba(255,45,120,.06) 8px 16px);color:#ff2d78;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 0 3px #fff}
.stud-contrast{font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--surface-2)}
.stud-contrast.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.stud-contrast.ok{color:var(--good,#16a34a)}
.stud-stage{position:relative;display:block;width:100%;max-width:560px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-2);background-size:cover!important;background-position:center!important;user-select:none;margin:0 auto;text-align:left}
.stud-layer{position:absolute;cursor:move}
.stud-layer.on{outline:2px solid var(--svc-ink);outline-offset:1px}
.stud-h{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:var(--svc-ink);border:2px solid #fff;cursor:nwse-resize;box-shadow:var(--shadow-1)}
.stud-layer-text{width:100%;height:100%;display:flex;align-items:center;white-space:pre-wrap;overflow:visible;word-break:normal;overflow-wrap:normal;line-height:1.18;font-family:var(--font-display)}
.stud-layer-shape{width:100%;height:100%}
.stud-layer-image{width:100%;height:100%;overflow:hidden}
.stud-layer-image img{width:100%;height:100%;object-fit:cover;display:block}
.stud-layer-empty{display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink-3)}
.stud-layer-icon{width:100%;height:100%;display:flex}
.stud-layer-icon svg{width:100%;height:100%}
.stud-toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stud-tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:11px;text-align:center;line-height:1.2}
.stud-tool:hover{border-color:var(--svc-ink);color:var(--ink);background:var(--svc-soft)}
.stud-quick-row{display:flex;gap:6px}
.stud-icon-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stud-icon-pick button{display:flex;align-items:center;justify-content:center;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);cursor:pointer}
.stud-icon-pick button:hover{border-color:var(--svc-ink);color:var(--ink)}
.stud-icon-pick button.on{background:var(--svc-soft);border-color:var(--svc-ink);color:var(--svc-ink)}
.stud-panel{display:flex;flex-direction:column;gap:8px;position:sticky;top:8px}
.stud-layers{display:flex;flex-direction:column;gap:2px}
.stud-layer-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.stud-layer-row:hover{background:var(--surface-2)}
.stud-layer-row.on{background:var(--svc-soft);color:var(--ink);font-weight:600}
.stud-layer-row span:not(.row-ic){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stud-layer-row .row-ic{flex:none;display:flex;gap:1px}
.stud-layer-row .row-ic button{border:0;background:none;color:inherit;opacity:.65;cursor:pointer;padding:3px;border-radius:5px;display:flex}
.stud-layer-row .row-ic button:hover{opacity:1;background:var(--surface-3)}
.stud-layer-row .row-ic button:disabled{opacity:.25;cursor:default}
.stud-color{display:flex;align-items:center;gap:9px}
.stud-designs-grid .stud-thumb{aspect-ratio:1;background:var(--surface-2);border-radius:var(--r-l) var(--r-l) 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.stud-designs-grid .stud-thumb img{width:100%;height:100%;object-fit:contain}
.stud-layer-shape{box-sizing:border-box}
.stud-layer.sel2{outline:2px dashed var(--ink-3);outline-offset:1px}
.stud-stage.pen-on,.stud-stage.eyedrop-on{cursor:crosshair}
.stud-pen-overlay,.stud-edit-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stud-anchor,.stud-handle{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);cursor:pointer;padding:0;pointer-events:auto}
.stud-anchor{width:11px;height:11px;background:var(--svc-ink);border-radius:2px}
.stud-anchor.pt-on{background:#fff;border-color:var(--svc-ink)}
.stud-handle{width:9px;height:9px;background:#fff;border-color:var(--svc-ink);border-radius:50%}
.stud-tool.on{border-color:var(--svc-ink);background:var(--svc-soft);color:var(--svc-ink)}
.stud-align-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stud-align-row button{display:flex;align-items:center;justify-content:center;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);cursor:pointer}
.stud-align-row button:hover{border-color:var(--svc-ink);color:var(--svc-ink)}
.stud-num-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stud-num-row .fld{display:flex;flex-direction:column;gap:3px}
.stud-num-row .fld span{font-size:11px;color:var(--ink-3)}
.stud-num-row input[type="number"]{width:100%;border:1px solid var(--line-2);border-radius:7px;padding:5px 7px;font-size:12.5px;background:var(--surface)}
.stud-seg2{display:flex;gap:6px}
.stud-seg2 button{flex:1;padding:6px 4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:11.5px}
.stud-seg2 button.on{border-color:var(--svc-ink);background:var(--svc-soft);color:var(--svc-ink)}
.stud-h[data-h="rot"]{right:auto;bottom:auto;left:50%;top:-30px;width:16px;height:16px;margin-left:-8px;background:#fff;cursor:grab}
.stud-h[data-h="nw"]{left:-7px;top:-7px;right:auto;bottom:auto;cursor:nwse-resize}
.stud-h[data-h="ne"]{right:-7px;top:-7px;bottom:auto;cursor:nesw-resize}
.stud-h[data-h="sw"]{left:-7px;bottom:-7px;right:auto;cursor:nesw-resize}
.stud-guide{position:absolute;background:#ff2d78;pointer-events:none;z-index:6}
.stud-rot{position:absolute;left:50%;top:-30px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid var(--svc-ink);cursor:grab;box-shadow:var(--shadow-1);z-index:3}
.stud-rot::after{content:"";position:absolute;left:50%;top:14px;width:2px;height:12px;margin-left:-1px;background:var(--svc-ink)}
.stud-marquee{position:absolute;border:1px solid var(--svc-ink);background:color-mix(in srgb,var(--svc-ink) 12%,transparent);pointer-events:none;z-index:7}
.stud-live{position:fixed;z-index:9999;pointer-events:none;background:#111;color:#fff;font-size:11.5px;padding:3px 7px;border-radius:6px;white-space:nowrap}
/* ---- Студия v3: раскладка как в Canva ---- */
.s2{display:grid;grid-template-columns:72px auto minmax(0,1fr) 270px;gap:0;align-items:start;min-height:calc(100vh - 150px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.s2-rail{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--surface-2);border-right:1px solid var(--line);align-self:stretch}
.s2-rail button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:10px;padding:8px 2px;font-size:10.5px;color:var(--ink-2);cursor:pointer}
.s2-rail button:hover{background:var(--surface-3);color:var(--ink)}
.s2-rail button.on{background:var(--svc-soft);color:var(--svc-ink);font-weight:700}
.s2-panel{width:300px;border-right:1px solid var(--line);padding:14px;align-self:stretch;max-height:calc(100vh - 150px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.s2-panel[hidden]{display:none}
.s2-panel h3{margin:0;font-size:15px}
.s2-main{display:flex;flex-direction:column;align-items:stretch;min-width:0;align-self:stretch;background:var(--bg)}
.s2-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);min-height:50px}
.s2-ctx .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.s2-ctx .lbl{font-size:12px;color:var(--ink-3)}
.s2-ctx nv-select{min-width:140px}
.s2-ctx .ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.s2-ctx .ib:hover{border-color:var(--svc-ink);color:var(--ink)}
.s2-ctx .ib.on{border-color:var(--svc-ink);background:var(--svc-soft);color:var(--svc-ink)}
.s2-ctx .num{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;height:30px;font-size:12.5px;background:var(--surface)}
.s2-main .stud-stage-wrap{padding:18px 12px;max-height:calc(100vh - 210px)}
.s2-props{border-left:1px solid var(--line);padding:12px;align-self:stretch;max-height:calc(100vh - 150px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.s2-props details{border-bottom:1px solid var(--line);padding-bottom:6px}
.s2-props summary{cursor:pointer;font-weight:700;font-size:13px;padding:4px 0}
.s2-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s2-tiles button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);cursor:pointer}
.s2-tiles button:hover{border-color:var(--svc-ink);color:var(--ink)}
.s2-icons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.s2-icons button{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.s2-icons button:hover{border-color:var(--svc-ink);color:var(--svc-ink)}
.s2-tpres{display:flex;flex-direction:column;gap:6px}
.s2-tpres button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.s2-tpres button:hover{border-color:var(--svc-ink)}
.s2-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.s2-grid2>*{min-width:0}
.s2-panel input[type=search]{width:100%;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font-size:13px;background:var(--surface)}
.s2-grid2 .th{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;aspect-ratio:1}
.s2-grid2 .th img{width:100%;height:100%;object-fit:cover;display:block}
.s2-grid2 .th .x{position:absolute;right:4px;top:4px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;cursor:pointer;display:none}
.s2-grid2 .th:hover .x{display:block}
.s2-grid2 .cr{font-size:10.5px;color:var(--ink-3);padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.s2-menu{position:fixed;z-index:9000;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:5px;min-width:210px}
.s2-menu button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.s2-menu button:hover{background:var(--surface-2)}
.s2-menu button small{color:var(--ink-3)}
.s2-menu button .t{flex:1;min-width:0}
.s2-menu button.on{font-weight:500;background:var(--surface-2)}
.s2-menu button .ck{width:14px;flex:none;display:flex;color:var(--svc-ink);margin-left:-8px}
.s2-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.s2-start{max-width:760px;margin:24px auto;display:flex;flex-direction:column;gap:18px;padding:0 12px}
.s2-start h2{margin:0;font-size:22px}
.s2-fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.s2-fmts button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.s2-fmts button:hover{border-color:var(--svc-ink);color:var(--ink)}
.s2-fmts i{display:block;background:var(--svc-soft);border:1px solid var(--svc-ink);border-radius:4px}
.s2-ai{display:flex;gap:8px;align-items:flex-end}
.s2-ai nv-textarea{flex:1}
.s2-recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.s2-recent button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-2)}
.s2-recent img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.s2-kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.s2-kbd kbd{background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit;white-space:nowrap}
@media (max-width:1250px){.s2{grid-template-columns:64px auto minmax(0,1fr)}.s2-props{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}}
@media (max-width:900px){.s2-panel{width:240px}}

/* ---------- Студия: слои деревом ---------- */
.lt{display:flex;flex-direction:column;gap:1px;user-select:none}
.lr{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 4px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.lr:hover{background:var(--l2,var(--surface-2))}
.lr.on{background:var(--svc-soft);color:var(--ink)}
.lr.on .lr-n{font-weight:500}
.lr.hid .lr-n,.lr.hid .lr-th{opacity:.45}
.lr button{border:0;background:none;color:inherit;cursor:pointer;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;padding:0}
.lr button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.lr-eye{opacity:.55}.lr:hover .lr-eye,.lr-eye.off{opacity:1}.lr-eye.off{color:var(--ink-3)}
.lr-th{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);flex:none}
.lr-th.g{background:var(--svc-soft);border-color:color-mix(in srgb,var(--svc-ink) 30%,transparent);color:var(--svc-ink)}
.lr-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-c{font:10.5px var(--font-mono);color:var(--ink-3);background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:5px;padding:0 5px;flex:none}
.lr-ac{display:flex;gap:0;flex:none}
.lr-ac button{display:none}
.lr-ac button.pin,.lr:hover .lr-ac button,.lr:focus-within .lr-ac button{display:grid}
.lr-ac button.pin{color:var(--svc-ink)}
.lr.grp{font-weight:500;color:var(--ink)}
.lr-tw{width:16px!important;margin-left:-4px;color:var(--ink-3)!important}
.lg-kids{position:relative;padding-left:22px}
.lg-kids::before{content:"";position:absolute;left:15px;top:0;bottom:6px;width:1px;background:var(--line-2)}
.lr.kid::before{content:"";position:absolute;left:-7px;top:50%;width:7px;height:1px;background:var(--line-2)}
.lr.dragging{opacity:.4}
.lr.drop-b{box-shadow:inset 0 2px 0 var(--svc-ink)}
.lr.drop-a{box-shadow:inset 0 -2px 0 var(--svc-ink)}
.lr.drop-in{background:var(--svc-soft);box-shadow:inset 0 0 0 1.5px var(--svc-ink)}

/* ---------- Студия: правая панель свойств ---------- */
.s2-props{padding:0!important;gap:0!important}
#stud-props{display:flex;flex-direction:column}
.pp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.pp-head b{display:block;font-weight:500;font-size:13.5px;line-height:1.25}
.pp-head small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3;margin-top:1px}
.pp-tile{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--svc-soft);color:var(--svc-ink);flex:none}
.pp-acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pp-acts kbd{font:10px var(--font-mono);opacity:.7;margin-left:2px}
.pp-sec{border-bottom:1px solid var(--line)}
.pp-sec>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:11px 14px 9px;cursor:pointer;font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);user-select:none}
.pp-sec[open]>summary{color:var(--ink)}
.pp-sec>summary::-webkit-details-marker{display:none}
.pp-sec>summary span{flex:1}
.pp-sec>summary em{font:normal 10px var(--font-mono);text-transform:none;letter-spacing:0;color:var(--svc-ink);background:var(--svc-soft);border-radius:5px;padding:1px 6px}
.pp-sec>summary nv-icon{color:var(--ink-3);transition:transform .15s}
.pp-sec:not([open])>summary nv-icon{transform:rotate(-90deg)}
.pp-sec>summary:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.pp-body{display:flex;flex-direction:column;gap:9px;padding:0 14px 14px}
.pp-row{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px;min-height:28px}
.pp-l{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-row .rng{gap:8px}
.pp-row .rng output{font:11px var(--font-mono);min-width:38px;color:var(--ink);font-weight:400}
.pp-row .rng input[type="range"]{height:4px}
.pp-row .rng input[type="range"]::-webkit-slider-thumb{width:14px;height:14px;border-width:2px}
.pp-row .rng input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-width:2px}
.pp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pp-in{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line-2);border-radius:9px;background:var(--l2,var(--surface-2));min-width:0}
.pp-in:focus-within{border-color:var(--svc-ink);box-shadow:0 0 0 3px var(--svc-soft)}
.pp-in span{font:10.5px var(--font-mono);color:var(--ink-3);flex:none;display:flex}
.pp-in input{flex:1;min-width:0;width:100%;border:0;background:none;outline:0;font:12px var(--font-mono);color:var(--ink);-moz-appearance:textfield}
.pp-in input::-webkit-outer-spin-button,.pp-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pp-ibs{display:flex;gap:4px;align-items:center;min-width:0}
.pp-ibs.wide>*{flex:1}
.pp-ibs.wide>.pp-ib{flex:none}
.pp-ib{width:30px;height:30px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.pp-ib:hover{border-color:var(--svc-ink);color:var(--ink)}
.pp-ib.on{background:var(--svc-soft);border-color:color-mix(in srgb,var(--svc-ink) 45%,transparent);color:var(--svc-ink)}
.pp-btn{height:30px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:12px;cursor:pointer;white-space:nowrap;min-width:0}
.pp-btn:hover{border-color:var(--svc-ink)}
.pp-btn.on{background:var(--svc-soft);border-color:color-mix(in srgb,var(--svc-ink) 45%,transparent);color:var(--svc-ink)}
.pp-btn.pri{background:var(--svc);border-color:transparent;color:#0d1211;font-weight:500}
.pp-seg{display:flex;gap:2px;padding:2px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);min-width:0}
.pp-seg button{flex:1;min-width:0;height:26px;border:0;border-radius:999px;background:none;color:var(--ink-2);font-size:11.5px;cursor:pointer;display:grid;place-items:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-seg button:hover{color:var(--ink)}
.pp-seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1)}
.pp-seg.pp-seg-ic button{padding:0}
.pp-seg.tight button{font-size:11px;padding:0 2px}
.pp-tools{display:flex;align-items:center;gap:4px}
.pp-tools .pp-sp{flex:1}
.pp-tools .pp-seg{flex:none;width:96px}
.pp-chips{display:flex;flex-wrap:wrap;gap:6px}
.pp-chips button{height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:12px;cursor:pointer}
.pp-chips button:hover{border-color:var(--svc-ink);color:var(--ink)}
.pp-chips button.on{background:var(--svc-soft);border-color:color-mix(in srgb,var(--svc-ink) 45%,transparent);color:var(--svc-ink)}
.pp-hint{font-size:11.5px;color:var(--ink-3);margin:0;line-height:1.4}
.pp-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 18px;color:var(--ink-3);font-size:12px;line-height:1.45}
.pp-empty p{margin:0}
.pp-empty kbd,.pp-acts kbd{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:10px var(--font-mono)}
.s2-props .stud-color nv-color-picker{min-width:0}
.s2-props .stud-contrast{font-size:11.5px;padding:5px 8px;border-radius:8px}
.s2-props .stud-icon-pick{grid-template-columns:repeat(6,1fr);gap:4px}
.s2-props .stud-icon-pick button{height:30px;border-radius:8px}
.s2-props .stud-presets{gap:5px}
.s2-props .stud-presets button{border-radius:9px;padding:3px 3px 4px}
.s2-props nv-textarea textarea{font-size:12.5px}
/* Быстрые инструменты элемента — в верхней строке */
.tb-ctx{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px}
.tb-div{width:1px;height:22px;background:var(--line-2);flex:none}
.tb-in{flex:1;min-width:0;display:flex;align-items:center;gap:4px;container-type:inline-size;overflow:hidden;height:36px}
.tb-in .ib{height:32px;min-width:32px;padding:0 8px;border:0;border-radius:999px;background:none;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:12px;flex:none;white-space:nowrap}
.tb-in .ib:hover{background:var(--l2,var(--surface-2));color:var(--ink)}
.tb-in .ib.on{background:var(--svc);color:#0d1211}
.tb-in .ib i{font-style:normal}
.tb-in .sep{width:1px;height:20px;background:var(--line-2);margin:0 3px;flex:none}
.tb-in .lbl{font-size:12px;color:var(--ink-3);white-space:nowrap;flex:none}
.tb-in .tb-font{width:132px;flex:none}
.tb-in nv-select .dd{height:32px;border-radius:999px}
.tb-in .tb-num{display:inline-flex;align-items:center;height:32px;border:1px solid var(--line-2);border-radius:999px;background:var(--l2,var(--surface));flex:none;overflow:hidden}
.tb-in .tb-num button{width:26px;height:100%;border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:14px}
.tb-in .tb-num button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tb-in .tb-num input{width:34px;border:0;background:none;text-align:center;font:12px var(--font-mono);color:var(--ink);outline:0}
.tb-in nv-color-picker{flex:none}
.tb-in .cpk-hex,.tb-in .cpk-trig>nv-icon{display:none}
.tb-in .cpk-trig{height:32px;width:32px;padding:0;justify-content:center;border-radius:50%}
@container (max-width:690px){.tb-in .p3{display:none!important}}
@container (max-width:480px){.tb-in .p2{display:none!important}}
.tb-zoom{height:34px;display:inline-flex;align-items:center;gap:4px;padding:0 10px;border:0;border-radius:999px;background:var(--l2,var(--surface-2));color:var(--ink);font:12px var(--font-mono);cursor:pointer;flex:none}
.tb-zoom:hover{color:var(--svc-ink)}
/* Переключатели вида — как активные пункты рельса/матрицы библиотеки: включено = заливка цветом сервиса. */
.tb-view{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--l2,var(--surface-2));flex:none}
.tb-vb{position:relative;width:30px;height:30px;border:0;border-radius:999px;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s,color .12s}
.tb-vb:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tb-vb.on{background:var(--svc);color:#0d1211}
.tb-vb.on:hover{background:color-mix(in srgb,var(--svc) 85%,var(--ink))}
.tb-vb b{position:absolute;right:-2px;top:-3px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;background:var(--ink);color:var(--surface);font:600 9px/14px var(--font-mono);text-align:center;box-shadow:0 0 0 2px var(--l2,var(--surface-2))}
.stud-gls{position:absolute;inset:0;z-index:7;pointer-events:none}
.stud-gl{position:absolute;pointer-events:auto}
.stud-gl.v{top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize;background:linear-gradient(to right,transparent 4px,#00b3ff 4px,#00b3ff 5px,transparent 5px)}
.stud-gl.h{left:0;right:0;height:9px;margin-top:-4px;cursor:row-resize;background:linear-gradient(to bottom,transparent 4px,#00b3ff 4px,#00b3ff 5px,transparent 5px)}
.stud-gl.a{width:400%;height:9px;cursor:move;display:flex;align-items:center}
.stud-gl.a i{display:block;width:100%;height:1px;background:#00b3ff}
.stud-gl:hover{filter:drop-shadow(0 0 1px #00b3ff)}
.stud-ruler{pointer-events:auto!important}
.stud-ruler.h{cursor:row-resize}.stud-ruler.v{cursor:col-resize}
.stud-ruler-c{cursor:copy}
body.gl-h,body.gl-h *{cursor:row-resize!important}body.gl-v,body.gl-v *{cursor:col-resize!important}body.gl-a,body.gl-a *{cursor:move!important}
.gl-pop{display:flex;flex-direction:column;gap:10px;padding:4px}
.gl-head{display:flex;align-items:center;gap:6px}.gl-head b{font-weight:500;font-size:13px}.gl-head .pp-sp{flex:1}
.gl-tg{height:26px;display:inline-flex;align-items:center;gap:4px;padding:0 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-3);font-size:11.5px;cursor:pointer}
.gl-tg.on{background:var(--svc-soft);border-color:color-mix(in srgb,var(--svc-ink) 40%,transparent);color:var(--svc-ink)}
.gl-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.gl-row{display:flex;align-items:center;gap:6px}
.gl-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,#00b3ff 14%,transparent);color:#0090d0;flex:none}
.gl-in{flex:1;min-width:0;display:flex;gap:4px}.gl-in .pp-in{flex:1;min-width:0;height:28px}
.gl-add{display:flex;gap:6px}.gl-add .pp-btn{flex:1;padding:0 6px;font-size:11.5px}
.shell.immersive .crumbs{flex:1 1 auto!important}
.shell.immersive .ed-name{width:clamp(110px,11vw,190px)}
.shell.immersive .ed-fmt{min-width:0;width:clamp(120px,12vw,200px)}
.tb-fmt{height:34px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border:0;border-radius:999px;background:var(--l2,var(--surface-2));color:var(--ink);font:12px var(--font-mono);cursor:pointer;flex:none}
.tb-fmt:hover{color:var(--svc-ink)}
@media (max-width:1800px){.shell.immersive .stud-save{font-size:0;width:9px;height:9px;padding:0;margin:0 6px;border-radius:50%;background:var(--ok,#16a34a);flex:none;cursor:help}
  .shell.immersive .stud-save.dirty{background:#e0a020}.shell.immersive .stud-save.err{background:var(--bad)}}
/* Редактор на всю рабочую область: вместо меню раздела — панель редактора, шапка — в верхней строке */
.top-ed{display:none}
.shell.immersive{grid-template-columns:78px minmax(0,1fr)}
.shell.immersive .side{display:none}
.shell.immersive .top{padding-block:8px;gap:8px}
.shell.immersive .crumbs{display:flex;align-items:center;gap:8px;overflow:visible;min-width:0;flex:0 1 auto}

.shell.immersive .top-sp{margin-left:0}
.ed-back{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:34px;width:34px;padding:0;border:0;border-radius:999px;background:var(--l2,var(--surface-2));color:var(--ink);font-size:12.5px;cursor:pointer;flex:none}
.ed-back:hover{color:var(--svc-ink)}
.ed-name{height:34px;width:clamp(120px,18vw,240px);border:1px solid transparent;border-radius:9px;background:none;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink);text-overflow:ellipsis}
.ed-name:hover{border-color:var(--line)}
.ed-name:focus{border-color:var(--svc-ink);background:var(--surface);outline:0}
.ed-fmt{min-width:190px}
.shell.immersive .scroll{overflow:hidden;scrollbar-gutter:auto}

.shell.immersive .s2{height:100%;min-height:0;grid-template-rows:minmax(0,1fr);grid-template-columns:72px auto minmax(0,1fr) 270px}
.shell.immersive .s2-panel,.shell.immersive .s2-props{max-height:none;min-height:0}

.s2-panel{position:relative}
.s2>.s2-rail{grid-column:1}.s2>.s2-panel{grid-column:2}.s2>.s2-main{grid-column:3}.s2>.s2-props{grid-column:4}

.s2-panel-x:hover{background:var(--surface-2);color:var(--ink)}
.s2-main .stud-stage-wrap{display:flex;flex-direction:column;align-items:center}

function openLayer(root,onClose){
  const prev=document.activeElement;document.body.append(root);
  const close=()=>{root.remove();document.removeEventListener("keydown",key,true);prev&&prev.focus&&prev.focus();onClose&&onClose()};
  const key=e=>{if(![...document.querySelectorAll(".ov")].pop()||[...document.querySelectorAll(".ov")].pop()!==root)return;
    if(e.key==="Escape"){e.stopPropagation();close()}
    if(e.key==="Tab"){const f=[...root.querySelectorAll("button,input,select,textarea,a[href],[tabindex='0']")].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}};
  document.addEventListener("keydown",key,true);
  root.addEventListener("mousedown",e=>{if(e.target===root)close()});
  return close;
}

    };

  });

  root.addEventListener("keydown",e=>{if(e.key==="Escape"){close();e.stopPropagation()}else if(e.key==="ArrowDown"){idx=Math.min(items.length-1,idx+1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){idx=Math.max(0,idx-1);draw();e.preventDefault()}else if(e.key==="Enter"&&e.target===inp){run(idx);e.preventDefault()}});
  list.onclick=e=>{const b=e.target.closest("[data-i]");if(b)run(+b.dataset.i)};
  root.addEventListener("mousedown",e=>{if(e.target===root)close()});root.querySelector("[data-x]").onclick=close;draw();inp.focus()};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"||(e.ctrlKey&&e.code==="KeyK")){e.preventDefault();NEON.acts.palette()}});

NEON.start=render;
})();
</script>
<script>
/* Разведка рекламы (Ad Intelligence) — единственный реальный сервис.
   Поля и статусы совпадают с /api/v1/creatives, /api/v1/runs, /api/v1/collections,
   /api/v1/advertisers, /api/v1/analytics/* и /api/v1/intents парсера. Бек не менялся —
   меняется только то, как это рисуется (дизайн-система NEON). */
(function(){
const {esc,ic,fmt,overlay,toast,confirm,formVals,FORMAT,favUrl,iconSvg,rngPct}=NEONUI,N=NEON,S=N.state;

const RUN_STATUS_MAP={queued:"queued",running:"running",succeeded:"done",failed:"failed"};

function hostOf(u){
  if(!u)return"";
  try{return new URL(u.includes("://")?u:"https://"+u).hostname}catch(e){return u.replace(/^https?:\/\//,"").split("/")[0]}
}
function fmtDateTime(iso){
  if(!iso)return"—";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"—";
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+", "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function realPlatformLabel(m){
  m=m||"";
  if(m.startsWith("vk-search"))return"VK · Реклама от автора";
  if(m.startsWith("vk-feed"))return"VK · лента";
  if(m.startsWith("vk-native"))return"VK Ads";
  if(m.startsWith("google-ads"))return"Google Ads";
  if(m.startsWith("taboola"))return"Taboola";
  if(m.startsWith("native-feed"))return"Яндекс Дзен";
  return"Яндекс / РСЯ";
}
function formatOf(rep){
  if(rep.creative_type==="video"||rep.video_src)return"video";
  if(rep.carousel_id!=null)return"carousel";
  if(rep.image_url)return"image";
  return"native";
}
function groupRealCreatives(items){
  const groups={},order=[];
  for(const row of items||[]){
    const key=row.content_fingerprint||("hash:"+row.creative_hash);
    if(!groups[key]){groups[key]={group_key:key,representative:row,platforms:[],first_seen_at:row.captured_at,last_seen_at:row.captured_at};order.push(key)}
    const g=groups[key];
    (row.group_methods||[row.detection_method]).forEach(m=>{if(!g.platforms.includes(m))g.platforms.push(m)});
    if(row.captured_at<g.first_seen_at)g.first_seen_at=row.captured_at;
    if(row.captured_at>=g.last_seen_at){g.last_seen_at=row.captured_at;g.representative=row}
  }
  return order.map(k=>groups[k]);
}

const seed=()=>({
  f:{q:"",platform:"",format:"",saved:"",job:"",rel:"all",src:"",aiIntent:"",sort:"recent",period:"",page:1,pageSize:25},
  aiIntents:[],aiPending:0,aiLoaded:false,
  savedViews:loadSavedViews(),
  lib:{groups:[],total:0,loaded:false,loading:false},
  sel:[],cmp:[],cmpF:{q:"",aiIntent:"",col:"",sort:"recent",rows:"all"},cmpC:{items:[],total:0,loaded:false,loading:false,limit:12},kSel:[],kcSel:[],kF:{q:"",sort:"added"},
  savedIds:loadSavedCreativeIds(),
  collections:[],collectionsLoaded:false,collectionItemsCache:{},openK:null,
  schedules:[],schedulesLoaded:false,scans:[],scansLoaded:false,scanF:{q:"",status:""},schedTab:"live",
  advertisers:[],advertisersLoaded:false,advQ:"",advSub:"all",
  intents:[],intentsLoaded:false,activeIntents:getActiveIntents(),
  ana:{loaded:false,loading:false,platSub:"coverage",campSub:"campaigns",freshSub:"fresh",totals:{},coverage:[],breakdown:[],fresh:[],freshTotal:0,discounts:[],discTotal:0,apps:[],appsTotal:0,cross:[],carousels:[],campaigns:[],keywords:[],growing:[],mismatch:[],coverageReport:[]}
});

const CR=()=>S.intel.lib.groups;
function findGroup(id){
  const pools=[CR(),(S.intel.cmpC&&S.intel.cmpC.items)||[],S.intel._lastCollectionItems||[],S.intel._ovItems||[],S.intel.cmp,S.intel.sel,S.intel.kSel||[]];
  for(const p of pools){const g=p.find(x=>x&&x.representative&&String(x.representative.id)===String(id));if(g)return g}
  return null;
}
function anyF(){const f=S.intel.f;return f.q||f.platform||f.format||f.saved||f.job||f.aiIntent||f.src==="history"||f.src==="all"||(f.period&&f.period!=="all")}
const VIEW_FIELDS=["q","platform","format","saved","job","aiIntent","sort","period"];
const viewKey=f=>JSON.stringify(VIEW_FIELDS.map(k=>f[k]||""));
function activeViewId(){const f=S.intel.f,key=viewKey(f),v=S.intel.savedViews.find(x=>viewKey(x.f)===key);return v?v.id:""}
function filtered(){
  const I=S.intel,f=I.f,savedSet=new Set(I.savedIds);
  if(I.lib.server)return CR();  // фильтры, сортировку и страницы уже применил сервер
  let r=CR().filter(g=>{
    const rep=g.representative;
    if(f.platform&&realPlatformLabel(rep.detection_method)!==f.platform)return false;
    if(f.format&&formatOf(rep)!==f.format)return false;
    if(f.saved==="yes"&&!savedSet.has(String(rep.id)))return false;
    if(f.saved==="no"&&savedSet.has(String(rep.id)))return false;
    return true;
  });
  if(f.sort==="name")r=[...r].sort((a,b)=>(a.representative.domain||"").localeCompare(b.representative.domain||"","ru"));
  else if(f.sort==="oldest")r=[...r].reverse();
  return r;
}
const kGroup=it=>({group_key:it.group_key,representative:it,platforms:[it.detection_method],first_seen_at:it.captured_at,last_seen_at:it.captured_at});
async function loadCmpCandidates(more){
  const I=S.intel,C=I.cmpC,f=I.cmpF;
  if(more)C.limit=Math.min(96,(C.limit||12)+12);else C.limit=12;
  const seq=C._seq=(C._seq||0)+1;C.loading=true;
  try{
    if(f.col){
      const d=await api("/api/v1/collections/"+f.col+"/items",{});if(seq!==C._seq)return;
      const q=(f.q||"").toLowerCase();
      let all=(d.items||[]).filter(it=>!q||((it.title||"")+" "+(it.domain||"")+" "+(it.description||"")).toLowerCase().includes(q)).map(kGroup);
      C.total=all.length;C.items=all.slice(0,C.limit);
    }else{
      const params={group:1,limit:C.limit,offset:0,sort:f.sort==="oldest"?"oldest":"recent",source:""};
      if(f.q)params.q=f.q;if(f.aiIntent)params.ai_intent=f.aiIntent;
      const d=await api("/api/v1/creatives",params);if(seq!==C._seq)return;
      C.items=groupRealCreatives(d.items);C.total=d.total||C.items.length;
    }
  }catch(err){if(seq!==C._seq)return;toast("Не удалось загрузить объявления: "+(err.message||""),{tone:"danger"})}
  C.loading=false;C.loaded=true;
  const box=document.getElementById("cmp-candidates");
  if(box){box.innerHTML=cmpCandidatesHtml();const c=document.getElementById("cmp-cnt");if(c)c.innerHTML=cmpCountHtml()}else N.refreshIf("intel-compare");
}
function cmpCountHtml(){const C=S.intel.cmpC;return C.loaded?`Показано <b>${C.items.length}</b> из ${fmt(C.total)}`:"Загружаем…"}
function cmpCandidatesHtml(){
  const I=S.intel,C=I.cmpC;
  if(!C.loaded)return '<nv-skeleton count="4"></nv-skeleton>';
  if(!C.items.length)return `<nv-empty icon="search-x" heading="Ничего не нашлось" text="Измените поиск или тему — либо откройте библиотеку и отметьте объявления там."><nv-button data-go="intel-library" icon="layout-grid">Открыть библиотеку</nv-button></nv-empty>`;
  return `<div class="grid g4lg">${C.items.map(g=>cardHtml(g,I.cmp.some(x=>String(x.representative.id)===String(g.representative.id)))).join("")}</div>${C.items.length<C.total&&C.items.length<96?`<div class="row" style="justify-content:center;margin-top:14px"><nv-button variant="secondary" icon="chevron-down" data-act="cmpMore">Показать ещё</nv-button></div>`:""}`;

/* Данные для nv-compare-board и вывод одной фразой: какое объявление сильнее и почему */
function cmpData(){
  const c=S.intel.cmp,R=c.map(g=>g.representative),st=R.map(r=>r.stats||{});
  const num=k=>st.map(x=>+x[k]||0),txt=fn=>R.map(fn);
  const M=[["days_active","Дней в открутке","Сколько дней парсер встречает объявление: долго крутят то, что окупается",fmtDays],
    ["shows","Встречено раз","Сколько раз парсер его увидел",v=>v],["runs","Запусков","В скольких запусках парсера попалось",v=>v],
    ["sites","Сайтов","На скольких площадках показывалось",v=>v],["cities","Городов","В скольких городах показывалось",v=>v]];
  const wins=R.map(()=>0);
  M.forEach(([k])=>{const a=num(k),mx=Math.max(...a);if(mx>0&&a.filter(x=>x===mx).length===1)wins[a.indexOf(mx)]++});
  const top=Math.max(...wins),wi=top>0&&wins.filter(x=>x===top).length===1?wins.indexOf(top):-1;
  const price=r=>{const t=String(r.price_text||"").trim();return /[1-9]/.test(t)?t:(+r.price_rub>0?fmt(r.price_rub)+" ₽":"")};
  const sections=[
    {title:"Насколько сильное",rows:M.map(([k,l,h,f])=>({label:l,hint:h,nums:num(k),values:num(k).map(v=>v?String(f(v)):"—")}))},
    {title:"Что предлагают",rows:[
      {label:"Заголовок",values:txt(r=>r.title)},{label:"Текст",values:txt(r=>r.description)},
      {label:"Кнопка",hint:"Призыв к действию",values:txt(r=>r.cta_text)},{label:"Цена",values:txt(price)},
      {label:"Скидка",values:txt(r=>r.discount_percent?r.discount_percent+"%":"")}]},
    {title:"Где и о чём",rows:[
      {label:"Рекламодатель",values:txt(r=>r.domain)},
      {label:"Площадка",values:c.map(g=>realPlatformLabel(g.representative.detection_method))},
      {label:"Формат",values:txt(r=>FORMAT[formatOf(r)]||r.creative_type)},
      {label:"Тема объявления",values:txt(r=>realAiIntent(r))},
      {label:"Найдено по запросу",values:txt(r=>(r.intents||[]).join(", "))},
      {label:"Впервые замечено",values:R.map((r,i)=>st[i].first_seen_at?fmtDateTime(st[i].first_seen_at):fmtDateTime(r.captured_at))},
      {label:"Последний раз",values:R.map((r,i)=>st[i].last_seen_at?fmtDateTime(st[i].last_seen_at):fmtDateTime(r.captured_at))},
      {label:"Маркировка (ERID)",values:txt(r=>r.erid?"есть":"нет")}]}];
  const columns=c.map((g,i)=>{const r=g.representative;return{id:String(r.id),title:r.title||r.domain,sub:r.domain||"—",domain:r.domain||"",image:r.image_url||r.video_poster||"",winner:i===wi?"Сильнее":""}});
  let verdict;
  if(wi>=0){const s=st[wi],parts=[];
    if(s.days_active>1)parts.push("крутится "+fmtDays(s.days_active));
    if(s.shows>1)parts.push("встречено "+s.shows+" "+plural(s.shows,"раз","раза","раз"));
    if(s.runs>1)parts.push("в "+s.runs+" "+plural(s.runs,"запуске","запусках","запусках"));
    if(s.sites>1)parts.push("на "+s.sites+" "+plural(s.sites,"сайте","сайтах","сайтах"));
    if(s.cities>1)parts.push("в "+s.cities+" "+plural(s.cities,"городе","городах","городах"));
    verdict=`Сильнее выглядит объявление <b>${esc(R[wi].domain||"№"+(wi+1))}</b> — «${esc((R[wi].title||"").slice(0,70))}»${parts.length?": "+esc(parts.join(", ")):""}. Чем дольше объявление в открутке и чем чаще встречается, тем вероятнее, что оно приносит заявки.`}
  else if(Math.max(...num("shows"))<=1)verdict="Все выбранные объявления парсер встретил по одному разу — судить о силе пока рано. Сравните предложения: заголовок, цену и кнопку.";
  else verdict="Явного лидера нет: объявления близки по охвату и сроку. Сравните предложения ниже.";
  return{columns,sections,verdict};
}
function cmpTrayHtml(){
  const c=S.intel.cmp;
  return `<div class="cmp-tray">${c.map(g=>{const r=g.representative;return `<span class="cmp-chip">${r.image_url?`<img src="${esc(r.image_url)}" alt="">`:`<img src="${esc(favUrl(r.domain||""))}" alt="">`}<span>${esc(r.domain||r.title||"—")}</span><button type="button" data-act="cmpAdd" data-id="${esc(r.id)}" aria-label="Убрать из сравнения">${ic("x",13)}</button></span>`}).join("")}${c.length?`<nv-button size="sm" variant="ghost" icon="trash-2" data-act="cmpClear">Очистить</nv-button>`:""}</div>`;
}
function cmpMatrixHtml(){
  const c=S.intel.cmp;
  if(c.length<2)return `<div class="cmp-steps"><div><b>1. Найдите объявления</b>В списке ниже — поиск по тексту и домену, фильтр по теме или подборке.</div><div><b>2. Отметьте от 2 до 4</b>Флажок в углу карточки. ${c.length?"Одно уже выбрано — добавьте ещё.":"Можно отметить и в библиотеке, затем нажать «Сравнить»."}</div><div><b>3. Смотрите, чем отличаются</b>Покажем, какое объявление сильнее и чем различаются предложения.</div></div>${c.length?`<div style="margin-top:12px">${cmpTrayHtml()}</div>`:""}`;

  <div class="row between" style="gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0">${cmpTrayHtml()}<div class="vsw sub"><nv-segmented options="all:Все строки|diff:Только различия" value="${S.intel.cmpF.rows==="diff"?"diff":"all"}" data-chg="cmpRows"></nv-segmented></div></div>
  <nv-compare-board id="cmp-board" ${S.intel.cmpF.rows==="diff"?"hide-same":""}></nv-compare-board>`;
}
const AI_UNKNOWN="не определён";
function realAiIntent(c){return c&&c.ai_intent&&c.ai_intent!==AI_UNKNOWN?c.ai_intent:""}
function fmtDays(n){n=+n||0;const a=n%10,b=n%100;return n+" "+(a===1&&b!==11?"день":(a>=2&&a<=4&&(b<10||b>=20)?"дня":"дней"))}
/* VK-пост: дата публикации и сколько висит (vk_posts, 19.11.2026) */
function vkLine(v){

function cardHtml(g,selected){
  const rep=g.representative,saved=S.intel.savedIds.includes(String(rep.id));

  const otherPlatforms=[...new Set((g.platforms||[]).map(realPlatformLabel))].filter(l=>l!==primary);

  return `<nv-creative-card cid="${esc(rep.id)}" headline="${esc(rep.title||rep.domain||"Без заголовка")}" advertiser="${esc((rep.vk&&rep.vk.owner&&rep.vk.owner.name)||rep.domain||"—")}" domain="${esc(rep.domain||"")}" platform="${esc(primary)}" ${rep.from_history?"history":""} format="${fmt}" date="${esc(fmtDateTime(g.last_seen_at||rep.captured_at))}" discount="${rep.discount_percent||""}" cta="${esc(rep.cta_text||"")}" ${mediaAttrs} colls="${esc(JSON.stringify((rep.collections||[]).map(c=>c.name)))}" ai-intent="${esc(realAiIntent(rep))}" stats="${esc(rep.vk&&rep.vk.posted_at?vkLine(rep.vk):statsLine(rep.stats))}" keyword="${esc((rep.intents||[]).join("; "))}" copy="${esc((rep.description||"").slice(0,180))}" desc-full="${esc(rep.description||"")}" platforms="${esc(otherPlatforms.join(","))}" ${saved?"saved":""} selectable ${selected?"selected":""}></nv-creative-card>`;

function bindCards(root,target){
  target=target||"sel";
  if(!root||root._bound)return;
  root._bound=true;
  root.addEventListener("nv-open",e=>openCreative(e.detail.id));
  root.addEventListener("nv-save",e=>{
    const id=String(e.detail.id);let ids=S.intel.savedIds;

/* ---------- Библиотека ---------- */
async function loadLibrary(extra){
  const I=S.intel;I.lib.loading=true;
  const seq=I._libSeq=(I._libSeq||0)+1;  // ответы приходят в любом порядке — учитываем только последний запрос
  if(document.getElementById("lib-res"))libRes();else N.refreshIf("intel-library","intel-compare");
  const f=I.f,ps=+f.pageSize||25,pg=Math.max(1,+f.page||1);
  const params={group:1,limit:ps,offset:(pg-1)*ps,sort:{name:"domain",oldest:"oldest",discount:"discount"}[f.sort]||"recent",source:f.src||""};
  if(f.q)params.q=f.q;
  if(f.platform)params.platform_label=f.platform;
  if(f.format)params.format=f.format;
  if(f.feature)params.feature=f.feature;
  if(f.saved==="yes")params.ids=I.savedIds.join(",")||"0";
  if(f.saved==="no"&&I.savedIds.length)params.exclude_ids=I.savedIds.join(",");
  // Выбран запуск: показываем его креативы, без сужения по «ключевому слову запуска»
  if(f.job){params.job_id=f.job;params.intent="";if(f.rel==="yes"||f.rel==="no")params.only_relevant=f.rel==="yes"?"1":"no"}
  if(I.f.aiIntent)params.ai_intent=I.f.aiIntent;
  const rg=NEONUI.rangeOf(I.f.period);
  // даты — по местному времени (как записаны в базе); у своего диапазона учитываем и конец
  if(rg){const loc=t=>{const d=new Date(t),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
    params.date_from=loc(rg[0]);if(String(I.f.period).includes(".."))params.date_to=loc(rg[1])}
  Object.assign(params,extra||{});
  try{

async function loadAiIntents(){

/* ---------- Подборки ---------- */
async function loadCollections(){
  try{
    const data=await api("/api/v1/collections",{});
    S.intel.collections=(data.items||[]).map(c=>({id:String(c.id),name:c.name,description:c.description,items_count:c.items_count,thumbs:c.thumbs||[],updated_at:c.updated_at||c.created_at}));
    S.intel.collectionsLoaded=true;
    N.refreshIf("intel-collections");
  }catch(err){S.intel.collectionsLoaded=true;toast("Не удалось загрузить подборки: "+(err.message||""),{tone:"danger"});N.refreshIf("intel-collections")}
}
async function openCollection(id){
  try{
    const data=await api("/api/v1/collections/"+id+"/items",{});
    S.intel.collectionItemsCache[id]=data.items||[];
    S.intel._lastCollectionItems=(data.items||[]).map(kGroup);
    const keys=new Set((data.items||[]).map(x=>x.group_key));
    S.intel.kSel=(S.intel.kSel||[]).filter(g=>keys.has(g.group_key));
    N.refreshIf("intel-collections");
  }catch(err){toast("Не удалось загрузить подборку: "+(err.message||""),{tone:"danger"})}
}
function kItemsFiltered(items){
  const f=S.intel.kF,q=(f.q||"").toLowerCase();
  let r=items.filter(it=>!q||((it.title||"")+" "+(it.domain||"")+" "+(it.description||"")).toLowerCase().includes(q));
  const st=(it,k)=>+((it.stats||{})[k])||0;
  if(f.sort==="days")r=[...r].sort((a,b)=>st(b,"days_active")-st(a,"days_active"));
  else if(f.sort==="shows")r=[...r].sort((a,b)=>st(b,"shows")-st(a,"shows"));
  else if(f.sort==="domain")r=[...r].sort((a,b)=>(a.domain||"").localeCompare(b.domain||"","ru"));
  return r;
}

  const I=S.intel,b=document.getElementById("k-bulk");if(!b)return;

/* Перенести или скопировать выбранное в другую подборку */
function moveDlg(mode){
  const I=S.intel,from=I.openK,sel=I.kSel.slice(),K=I.collections.filter(k=>k.id!==from);
  if(!sel.length)return;
  const verb=mode==="move"?"Перенести":"Скопировать";
  overlay("modal",{title:verb+" в другую подборку",subtitle:"Объявлений: "+sel.length,
    body:`<nv-select name="k" label="Куда" options="${K.map(k=>k.id+":"+esc(k.name)).join("|")}${K.length?"|":""}new:Создать новую подборку" value="${K[0]?K[0].id:"new"}"></nv-select><nv-input name="n" label="Название новой подборки" placeholder="Например, Лучшие офферы" hint="Нужно, только если выбрана новая подборка"></nv-input>`,
    actions:[{label:"Отмена"},{label:verb,variant:"primary",fn(r,close){
      const v=formVals(r);
      (async()=>{
        try{
          let id=v.k,name;
          if(id==="new"){
            if(!(v.n||"").trim()){r.querySelector('[name="n"]').setAttribute("error","Введите название подборки");return}
            const created=await apiPost("/api/v1/collections",{name:v.n.trim(),description:""});id=String(created.id);name=created.name;
          }else name=(K.find(k=>k.id===id)||{}).name;
          const res=await apiPost("/api/v1/collections/"+id+"/items/bulk",{items:sel.map(g=>({group_key:g.group_key,creative_id:g.representative.id}))});
          if(mode==="move")await apiPost("/api/v1/collections/"+from+"/items/remove",{group_keys:sel.map(g=>g.group_key)});
          I.kSel=[];delete I.collectionItemsCache[id];
          await loadCollections();await openCollection(from);
          toast((mode==="move"?"Перенесено":"Скопировано")+" в «"+name+"»: "+sel.length+(res&&res.skipped?" (уже были там: "+res.skipped+")":""),{tone:"success"});
          close();
        }catch(err){toast("Не удалось: "+(err.message||""),{tone:"danger"})}
      })();
      return false;
    }}]});
}

function fmtMinutes(ms){const m=Math.round(ms/60000);return m<1?"меньше минуты":m<60?m+" мин":Math.floor(m/60)+" ч"+(m%60?" "+(m%60)+" мин":"")}

function scanDurationMedian(list){
  const durs=list.filter(s=>s.status==="succeeded"&&s.started_at&&s.finished_at).map(s=>new Date(s.finished_at)-new Date(s.started_at)).filter(d=>d>0).sort((a,b)=>a-b);
  return durs.length?durs[Math.floor(durs.length/2)]:null;
}
function scanCardInfo(s,medianMs){
  if(s.status==="succeeded"){
    const durMs=s.started_at&&s.finished_at?new Date(s.finished_at)-new Date(s.started_at):null;
    return{status:"done",pct:"100",note:durMs!=null?"Готово за "+fmtMinutes(durMs):"Готово"};
  }
  if(s.status==="failed"){
    const durMs=s.started_at&&s.finished_at?new Date(s.finished_at)-new Date(s.started_at):null;
    return{status:"failed",pct:"100",note:durMs!=null?"Ошибка через "+fmtMinutes(durMs):"Ошибка"};
  }
  if(s.status==="queued")return{status:"queued",pct:"0",note:"Ждёт воркера"};
  const stg=stageText(s.stage),pre=stg?stg+" · ":"";
  if(!s.started_at||!medianMs)return{status:"running",pct:"",indeterminate:true,note:pre+"Идёт сканирование…"};
  const elapsed=Date.now()-new Date(s.started_at),remain=medianMs-elapsed;
  const pct=Math.max(5,Math.min(96,Math.round(elapsed/medianMs*100)));
  return{status:"running",pct:String(pct),note:pre+(remain>0?"~"+fmtMinutes(remain)+" осталось":"дольше обычного ("+fmtMinutes(elapsed)+")")};
}

const SCHED_STATUS={active:["Активно","success"],paused:["На паузе","warning"],finished:["Завершено","neutral"],cancelled:["Остановлено","neutral"]};
function schedTimeline(x){
  const day=864e5,start=new Date(x.created_at).getTime();
  const passed=(x.runs_created||0)+(x.runs_skipped||0),rpd=x.runs_per_day;
  const cur=isNaN(start)?Math.floor(passed/rpd):Math.floor((Date.now()-start)/day);
  let cells="";
  for(let d=0;d<x.duration_days;d++){
    const cls=d<cur||x.status==="finished"?"past":d===cur&&(x.status==="active"||x.status==="paused")?"now":"";
    const dots=Array.from({length:Math.min(rpd,12)},(_,k)=>`<i class="${d*rpd+k<passed?"on":""}"></i>`).join("");
    cells+=`<div class="sch-d ${cls}" title="День ${d+1}: ${rpd} ${plural(rpd,"запуск","запуска","запусков")}"><b>${d+1}</b><span class="dots">${dots}</span></div>`;
  }
  const dayNo=Math.min(x.duration_days,Math.max(1,cur+1));
  return `<div class="sch-tl" role="img" aria-label="Таймлайн расписания по дням">${cells}</div><div class="sch-tlc">${x.status==="active"||x.status==="paused"?"День "+dayNo+" из "+x.duration_days+" · ":""}точки — слоты запусков за день, зелёные уже прошли</div>`;
}

/* Считаем по уже загруженным последним креативам (captured_at) — без доп. запросов к бэкенду. */
function dailyTrend(items,days){
  // данные по дням считает сервер по всей базе; старый подсчёт по загруженным карточкам — запасной
  const dl=S.intel.ana.daily||[];
  if(dl.length){const t=dl.slice(-days);return{labels:t.map(x=>x.day.slice(8,10)+"."+x.day.slice(5,7)),values:t.map(x=>x.count)}}
  const now=new Date(),buckets=[];
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);buckets.push({key:d.toISOString().slice(0,10),label:d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}),n:0})}
  const byKey={};buckets.forEach(b=>byKey[b.key]=b);
  (items||[]).forEach(c=>{const k=(c.captured_at||"").slice(0,10),b=byKey[k];if(b)b.n++});
  return{labels:buckets.map(b=>b.label),values:buckets.map(b=>b.n)};
}
function periodDelta(items,days){
  const dl=S.intel.ana.daily||[];
  if(dl.length>=2*days){const sum=a=>a.reduce((x,y)=>x+y.count,0),a=sum(dl.slice(-days)),b=sum(dl.slice(-2*days,-days));
    if(!b)return{value:a,delta:"",trend:"flat"};const pct=Math.round((a-b)/b*100);return{value:a,delta:Math.abs(pct)>999?"более 999%":Math.abs(pct)+"%",trend:pct>0?"up":pct<0?"down":"flat"}}
  const now=Date.now(),cur=now-days*864e5,prev=now-2*days*864e5;let a=0,b=0;
  (items||[]).forEach(c=>{const t=new Date(c.captured_at||0).getTime();if(!t)return;if(t>=cur)a++;else if(t>=prev)b++});
  if(!b)return{value:a,delta:"",trend:"flat"};
  const pct=Math.round((a-b)/b*100);
  return{value:a,delta:Math.abs(pct)+"%",trend:pct>0?"up":pct<0?"down":"flat"};
}

function withTimeout(p,ms,what){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+": нет ответа за "+Math.round(ms/1000)+" с")),ms))])}
async function loadReport(refresh){
  const A=S.ads,r=A.rep,seq=(r.seq||0)+1;r.seq=seq;r.loading=true;N.refreshIf("ads-report");
  try{
    const per=String(r.period||"30"),cust=per.includes("..")?per.split(".."):null;
    // presets -> days: the server counts the range by ITS clock (browser clocks may be wrong, 2026-11-13)
    const data=await withTimeout(api("/api/v1/ads/ads-dashboard",{date_from:cust?cust[0]:undefined,date_to:cust?cust[1]:undefined,days:cust?undefined:per,project_ids:r.projects||undefined,threshold:r.threshold,with_status:"false"}),60000,"Отчёт");
    if(seq!==r.seq)return;
    const prev={};((r.data&&r.data.items)||[]).forEach(a=>{if(a.status)prev[a.account_id]=a.status});
    (data.items||[]).forEach(a=>{if(!a.status&&prev[a.account_id])a.status=prev[a.account_id]});
    r.data=data;r.loaded=true;(data.errors||[]).forEach(e=>toast("Статистика Click.ru: "+e,{tone:"warning"}));

/* Подключение Click.ru = API-токен + вход в веб-кабинет (логин/пароль).

   из пула как Директ-интеграции. Вход выполняет Chrome на стороне ParsYa,
   cookies сессии хранятся зашифрованными у подключения (addAvto). Пароль и
   cookies в ЛК никогда не возвращаются. */
const CLICKRU_WEB={ok:["connected","Вход в кабинет выполнен","success"],relogin_required:["attention","Нужен повторный вход","warning"],failed:["failed","Вход в кабинет не удался","danger"],none:["attention","Нет входа в кабинет","warning"]};
function clickruWeb(c){return CLICKRU_WEB[c&&c.web_status]||CLICKRU_WEB.none}
function clickruToast(c){
  if(!c)return;
  if(c.web_status==="ok")toast("Click.ru «"+c.label+"»: вход в кабинет выполнен",{tone:"success"});
  else if(c.web_status==="failed")toast("Вход в кабинет «"+c.label+"» не удался: "+(c.web_status_message||"проверьте логин и пароль"),{tone:"danger"});
  else if(c.web_status_message)toast("«"+c.label+"»: "+c.web_status_message,{tone:"warning"});
  else toast("Подключение «"+c.label+"» добавлено. Укажите логин и пароль кабинета — без них нельзя создавать аккаунты.",{tone:"warning"});
}

   (Проект → Аккаунт Click.ru → Юрлицо → Количество → Креативы) — объединяет

function normalizeDomain(raw){
  let d=(raw||"").trim();
  if(d&&!/^https?:\/\//i.test(d))d="https://"+d;
  return d;
}
function resolveRegionIds(raw,geoRegions){
  const names=(raw||"").split(",").map(x=>x.trim()).filter(Boolean);
  const ids=[],unresolved=[];
  for(const n of names){
    if(/^\d+$/.test(n)){ids.push(+n);continue}
    const hit=(geoRegions||[]).find(r=>(r.name||"").toLowerCase()===n.toLowerCase());
    if(hit)ids.push(hit.id);else unresolved.push(n);
  }
  return{ids:[...new Set(ids)],unresolved};
}

  function payerTypeFieldsHtml(type,set){
    set=set||{};

  function buildPayerPayload(type,v){
    const p={type,inn:(v.inn||"").trim(),phone:(v.phone||"").trim()||null};
    if(type==="PERSON"){p.last_name=(v.last_name||"").trim();p.first_name=(v.first_name||"").trim();p.middle_name=(v.middle_name||"").trim();return p}
    p.name=(v.name||"").trim();p.tax_form=v.tax_form||"OSN";
    p.business_address={address:(v.business_address||"").trim(),postal_code:(v.business_postal||"").trim()};
    p.actual_address={address:(v.actual_address||"").trim(),postal_code:(v.actual_postal||"").trim()};
    p.bank={name:(v.bank_name||"").trim(),rcbic:(v.bank_rcbic||"").trim(),account:(v.bank_account||"").trim(),correspondent_account:(v.bank_corr||"").trim()};
    if(type==="BUSINESS"){p.full_name=(v.full_name||"").trim();p.kpp=(v.kpp||"").trim();p.ogrn=+v.ogrn||null}
    else p.ogrnip=+v.ogrnip||null;
    return p;
  }

// Отображаемая ссылка (TextAd.DisplayUrlPath): до 20 символов (# шаблона не
// считается), буквы, цифры и - № / % #; нельзя пробел, _, -- и //.
function displayUrlError(v){v=(v||"").trim();if(!v)return "";
  if(v.replace(/#/g,"").length>20)return "Не больше 20 символов";
  if(/[\s_]/.test(v))return "Нельзя пробел и _";
  if(/--|\/\//.test(v))return "Нельзя -- и //";
  if(!/^[\p{L}\p{N}\-№\/%#]+$/u.test(v))return "Только буквы, цифры и - № / % #";
  return ""}
function displayUrlField(value,label){return `<nv-input name="display_url" label="${esc(label)}" value="${esc(value||"")}" placeholder="например: santa-klaus/kupit" style="margin-top:8px"></nv-input><div class="muted" data-durl-msg style="font-size:12px;margin-top:2px"></div>`}
function mountDisplayUrl(root,onChange){const i=root.querySelector('nv-input[name="display_url"]'),m=root.querySelector("[data-durl-msg]");if(!i)return;
  const upd=v=>{const e=displayUrlError(v),n=(v||"").replace(/#/g,"").trim().length;m.textContent=e||`${n}/20 — пусто: Директ покажет домен`;m.style.color=e?"var(--bad)":"";onChange&&onChange(v)};
  upd(i.getAttribute("value")||"");i.addEventListener("nv-change",e=>upd(e.detail.value))}

  try{const r=await apiPost("/api/v1/ads/projects/"+project.id+"/campaigns/bulk-jobs/"+jobId+"/resume",{});
    toast("Запуск продолжен — #"+r.job_id,{tone:"success"});loadProjects();openJobDrawer(project,r.job_id)}
  catch(err){toast(err.message||"Не удалось продолжить",{tone:"danger"});if(btn)btn.removeAttribute("loading")}
}

function openJobDrawer(project,jobId){
  overlay("drawer",{title:"Запуск: "+project.name,subtitle:"Задание #"+jobId,size:"md",
    body:`<div id="job-res"><nv-skeleton count="3"></nv-skeleton></div>`,
    mount(root){
      const poll=async()=>{
        if(!root.isConnected)return;
        let job;
        try{job=await api("/api/v1/ads/projects/"+project.id+"/campaigns/bulk-jobs/"+jobId,{})}
        catch(err){const host=root.querySelector("#job-res");if(host)host.innerHTML=`<nv-empty icon="alert-triangle" heading="Не удалось получить статус" text="${esc(err.message||"")}"></nv-empty>`;return}
        if(!root.isConnected)return;
        const host=root.querySelector("#job-res");
        if(!host)return;
        host.innerHTML=jobStatusHtml(job);
        const rb=host.querySelector("[data-job-resume]");if(rb)rb.onclick=()=>resumeLaunch(project,jobId,rb);
        if(job.items&&job.items.length)wireTable(root,"job-items-t",job.items.map((it,i)=>({id:i,...it})),
          [{key:"pool_login",label:"Аккаунт"},{key:"campaign_id",label:"Campaign ID"},
           {key:"status",label:"Статус",render:x=>x.status==="created"?'<nv-badge tone="success">Создано</nv-badge>':`<nv-badge tone="danger">${esc(x.error||"Ошибка")}</nv-badge>`},
           {key:"topup_status",label:"Пополнение",render:x=>!x.topup_rub?"—":x.topup_status==="SUCCESS"?`<nv-badge tone="success">${x.topup_rub} ₽</nv-badge>`:`<nv-badge tone="warning">${esc(x.topup_status||"—")}</nv-badge>`},

        if(job.status==="running")setTimeout(poll,4000);

const PROJ_STATUS={draft:["Черновик",""],generating:["Генерация","info"],running:["Идёт запуск","info"],launched:["Запущен","success"],failed:["Ошибка запуска","danger"]};
function projStatus(p){
  const s=p.stats||{};
  if(s.running_job_id)return"running";
  if(s.ozon_running)return"generating";
  if(!s.jobs_count)return"draft";
  return s.last_job_status==="failed"?"failed":"launched";
}
function projPayerNames(p){
  const by=new Map((S.ads.payers||[]).map(x=>[x.id,x]));
  return ((p.stats||{}).payer_ids||[]).map(id=>by.has(id)?payerLabel(by.get(id)):"#"+id);
}
const PROJ_F_KEY="parsya_ads_proj_filter";
function projFilter(){
  if(!S.ads.projF){let f={};try{f=JSON.parse(localStorage.getItem(PROJ_F_KEY)||"{}")}catch(e){}S.ads.projF={q:"",mode:"",status:"",payer:"",conn:"",camps:"",period:"",sort:"recent",...f}}
  return S.ads.projF;
}
function filteredProjects(){
  const f=projFilter(),q=(f.q||"").trim().toLowerCase();
  const modes=(f.mode||"").split(",").filter(Boolean),stats=(f.status||"").split(",").filter(Boolean),payers=(f.payer||"").split(",").filter(Boolean),conns=(f.conn||"").split(",").filter(Boolean);
  const rows=(S.ads.projects||[]).filter(p=>{
    if(q&&!((p.name||"")+" "+(p.domain||"")+" "+(p.ozon_url||"")).toLowerCase().includes(q))return false;
    if(modes.length&&!modes.includes(p.launch_mode==="ozon"?"ozon":"direct"))return false;
    if(stats.length&&!stats.includes(projStatus(p)))return false;
    if(payers.length&&!((p.stats||{}).payer_ids||[]).some(id=>payers.includes(String(id))))return false;
    if(conns.length&&!((p.stats||{}).connection_ids||[]).some(id=>conns.includes(String(id))))return false;
    if(f.camps==="yes"&&!(p.stats||{}).campaigns_count)return false;
    if(f.camps==="no"&&(p.stats||{}).campaigns_count)return false;
    if(f.period&&f.period!=="all"&&(String(f.period).includes("..")||+f.period>0)){const [a,b]=String(f.period).includes("..")?f.period.split(".."):[new Date(Date.now()-(+f.period||0)*864e5).toISOString().slice(0,10),""];
      const c=(p.created_at||"").slice(0,10);if(a&&c<a)return false;if(b&&c>b)return false}
    return true;
  });
  const t=p=>(p.stats&&p.stats.last_job_at)||p.updated_at||p.created_at||"";
  const sorters={recent:(a,b)=>t(b).localeCompare(t(a)),created:(a,b)=>(b.created_at||"").localeCompare(a.created_at||""),
    name:(a,b)=>(a.name||"").localeCompare(b.name||"","ru"),campaigns:(a,b)=>((b.stats||{}).campaigns_count||0)-((a.stats||{}).campaigns_count||0)};
  return rows.sort(sorters[f.sort]||sorters.recent);
}

report(){
  const A=S.ads,r=A.rep,d=r.data;
  const projOpts=((d&&d.projects)||(A.projects||[]).map(p=>({id:p.id,name:p.name}))).map(p=>p.id+":"+String(p.name||("Проект "+p.id)).replace(/[|:,]/g," ")).join("|")||"_:Проектов пока нет";
  const stOpts=AD_ST_ORDER.map(c=>c+":"+adStLabel(c)).join("|");
  return{title:"Отчётность",sub:"Дашборд по проектам: аккаунты, показы, клики, лиды и расход Click.ru, статусы модерации.",
  body:`<div class="toolbar"><nv-filter-select label="Проекты" value="${esc(r.projects)}" options="${esc(projOpts)}" placeholder="Все проекты" min-width="280" data-chg="adsRepProjects"></nv-filter-select>
    <nv-date-range label="Период" presets="7:7 дней|30:30 дней|90:90 дней|365:Год" value="${esc(r.period||"30")}" data-chg="adsRepPeriod"></nv-date-range>
    <nv-input label="Порог «больше»" type="number" value="${esc(String(r.threshold))}" style="max-width:150px" data-chg="adsRepThreshold"></nv-input>
    <nv-button icon="refresh-cw" data-act="adsRepLoad" hint="Заново спросить Click.ru и Директ, включая статусы">Обновить</nv-button></div>
  <div id="ads-rep-res">${r.loading&&!d?'<nv-skeleton count="6"></nv-skeleton>':""}</div>`,
  after(root){
    if(!r.loaded&&!r.loading){loadReport();return}
    const el=root.querySelector("#ads-rep-res");if(!d||!el)return;
    const sm=d.summary||{},t=d.totals||{},th=sm.threshold,rub=v=>v==null?"—":fmt(Math.round(v))+" ₽",rub2=v=>v==null?"—":Number(v).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₽";
    const items=(d.items||[]).filter(a=>(!r.status||r.status.split(",").includes((a.status||{}).code||"unknown"))&&(!r.q||(a.pool_login+" "+a.account_id+" "+(a.campaign_id||"")+" "+(a.project_name||"")).toLowerCase().includes(r.q.toLowerCase())));
    const by=sm.by_status||{};
    const chart=(keys,names,type)=>esc(JSON.stringify({labels:(d.daily.labels||[]).map(x=>x.slice(8,10)+"."+x.slice(5,7)),series:keys.map((k,i)=>({name:names[i],values:d.daily[k]||[]}))}));
    const dd=x=>x?x.slice(8,10)+"."+x.slice(5,7)+"."+x.slice(0,4):"";
    // Лиды по дням (2026-11-17): из Б24 по дате создания лида; цель Метрики — отдельной линией, только если не пустая
    const dLab=d.daily.labels||[],crmD=(d.crm&&d.crm.daily)||null;
    const crmDay=crmD?Object.fromEntries((crmD.labels||[]).map((x,i)=>[x,(crmD.leads||[])[i]||0])):null;
    const b24Leads=crmDay?dLab.map(x=>crmDay[x]||0):null,goalLeads=d.daily.leads||[];
    const clChart=esc(JSON.stringify({labels:dLab.map(x=>x.slice(8,10)+"."+x.slice(5,7)),series:[{name:"Клики",values:d.daily.clicks||[]}]
      .concat(b24Leads?[{name:"Лиды Б24",values:b24Leads}]:[])
      .concat(!b24Leads||goalLeads.some(v=>v)?[{name:b24Leads?"Конверсии (цель)":"Лиды",values:goalLeads}]:[])}));
    const leadsBar=b24Leads?esc(JSON.stringify({labels:dLab.map(x=>x.slice(8,10)+"."+x.slice(5,7)),series:[{name:"Лиды Б24",values:b24Leads}]})):"";
    const crm=d.crm,ci=(crm&&crm.items)||{},ct=(crm&&crm.totals)||{},cps=((crm&&crm.projects)||[]);
    const crmOn=cps.filter(x=>x.source),crmOff=cps.filter(x=>!x.source);
    const crmOf=a=>ci[a.account_id]||null;
    const crmBlock=!crm?(r.crmLoading?'<div class="muted" style="font-size:12.5px;margin-top:12px">Подтягиваю лиды, клиентов и договоры из Б24…</div>':""):
      !crmOn.length?`<nv-callout tone="info" heading="Лиды из Б24 не подключены" style="margin-top:12px">Откройте проект и выберите «Источник лидов Б24» (вебхук из раздела «Конверсии») — в отчёте появятся лиды, клиенты и договоры по каждой кампании.</nv-callout>`:
      `<div class="dash-g4" style="margin-top:12px">
        ${stat("Лиды Б24",fmt(ct.leads||0),`note="CR клик → лид ${t.clicks?(Math.round((ct.leads||0)/t.clicks*1000)/10).toLocaleString("ru-RU")+"%":"—"} · цена лида ${ct.leads?rub2((t.spend||0)/ct.leads):"—"}" hint="Лиды Битрикс24 за период, у которых utm_campaign заканчивается ID кампании Директа"`)}
        ${stat("Клиенты",fmt(ct.clients||0),`note="контакты лидов" hint="Лиды, у которых в Б24 появился контакт"`)}
        ${stat("Договоры",fmt(ct.deals||0),`note="сделки воронки «Продажа»" hint="Сделки воронки «Продажа» по контактам и лидам кампаний"`)}
        ${stat("Успешные договоры",fmt(ct.won||0),`note="${ct.won_sum?"на "+fmt(Math.round(ct.won_sum))+" ₽":"стадия «успех»"}"`)}
      </div>

/* Шрифты холста: Onest уже подключён интерфейсом, остальные — Google Fonts по требованию.
   Canvas НЕ понимает CSS-переменные (var(--font-display) молча превращался в Arial),
   поэтому и на холсте, и в экспорте используется реальное имя семейства. */
const STUDIO_FONTS=["Onest","Manrope","Inter","Montserrat","Roboto","Rubik","Oswald","PT Serif","Play"];
const studioFontLoaded=new Set(["Onest"]);
/* Свои шрифты пользователя (2026-11-20): файлы на сервере, подключаются через FontFace —
   работают и на холсте, и в экспорте canvas. */
let studioCustomFonts=[],studioCustomLoaded=false;
function studioFontList(){return STUDIO_FONTS.concat(studioCustomFonts.map(f=>f.family).filter(f=>!STUDIO_FONTS.includes(f)))}
function studioFontOf(l){return studioFontList().includes(l.font)?l.font:"Onest"}
async function studioLoadCustomFonts(force){
  if(studioCustomLoaded&&!force)return;studioCustomLoaded=true;
  try{studioCustomFonts=(await api("/api/v1/studio/fonts")).fonts||[]}catch(e){studioCustomFonts=[];return}
  for(const f of studioCustomFonts){if(studioFontLoaded.has(f.family))continue;
    try{const res=await netFetch(API_BASE+"/api/v1/studio/fonts/"+f.id+"/file",{headers:{Authorization:"Bearer "+session.token}});if(!res.ok)continue;
      const face=new FontFace(f.family,await res.arrayBuffer());await face.load();document.fonts.add(face);studioFontLoaded.add(f.family)}catch(e){}}
  studioLayoutStage(document);studioRefreshPanel();const pp=document.getElementById("stud-props");if(pp)studioRenderSidebar(document);
}
function studioEnsureFont(name){
  if(!name||studioFontLoaded.has(name)||studioCustomFonts.some(f=>f.family===name))return;
  studioFontLoaded.add(name);
  const link=document.createElement("link");link.rel="stylesheet";
  link.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(name).replace(/%20/g,"+")+":wght@400;700;800&display=swap&subset=cyrillic";
  link.onload=()=>{document.fonts&&document.fonts.load(`700 40px "${name}"`).then(()=>studioLayoutStage(document)).catch(()=>{})};
  document.head.append(link);
}
async function studioFontsReady(design){
  const fams=new Set(design.layers.filter(l=>l.type==="text").map(studioFontOf));
  fams.forEach(studioEnsureFont);
  if(!document.fonts)return;
  try{await Promise.race([Promise.all([...fams].flatMap(f=>[document.fonts.load(`400 40px "${f}"`),document.fonts.load(`700 40px "${f}"`)])),new Promise(r=>setTimeout(r,4000))])}catch(e){}
}

function fileToDataUrl(file,maxDim){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      if(w>maxDim||h>maxDim){const k=maxDim/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      const alpha=/png|gif|webp|svg/.test(file.type||"");
      resolve({dataUrl:alpha?c.toDataURL("image/png"):c.toDataURL("image/jpeg",0.88),naturalW:img.naturalWidth,naturalH:img.naturalHeight});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Не удалось прочитать изображение"))};
    img.src=url;
  });
}
function studioLoadImg(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}

}

const studioCrcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function studioZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){const name=enc.encode(f.name),crc=studioCrc32(f.data),sz=f.data.length;
    const head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0)]);
    parts.push(head,name,f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=head.length+name.length+sz}
  const csz=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csz),...u32(off),...u16(0)]);

function studioPdf(pages){
  /* pages: [{jpeg:Uint8Array,w,h}] — каждая страница = одна JPEG-картинка на весь лист. */
  const enc=new TextEncoder(),chunks=[],offs=[];let pos=0;
  const put=x=>{const b=typeof x==="string"?enc.encode(x):x;chunks.push(b);pos+=b.length};
  const n=pages.length,kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(" ");
  put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  offs[1]=pos;put("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  offs[2]=pos;put(`2 0 obj<</Type/Pages/Kids[${kids}]/Count ${n}>>endobj\n`);
  pages.forEach((p,i)=>{const o=3+i*3,W=(p.w*0.75).toFixed(2),H=(p.h*0.75).toFixed(2),cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    offs[o]=pos;put(`${o} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im${i} ${o+1} 0 R>>>>/Contents ${o+2} 0 R>>endobj\n`);
    offs[o+1]=pos;put(`${o+1} 0 obj<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.jpeg.length}>>stream\n`);put(p.jpeg);put("\nendstream endobj\n");
    offs[o+2]=pos;put(`${o+2} 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`)});
  const total=2+n*3,xref=pos;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(x+`trailer<</Size ${total+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:"application/pdf"});
}

/* Смена формата: переразметка с сохранением пропорций (а не растягивание). Центр
   слоя остаётся на том же относительном месте, размеры — единый масштаб. */
function studioRefit(design,fmt){
  const A=STUDIO_FMT[design.format],B=STUDIO_FMT[fmt];if(!A||!B||design.format===fmt)return design;
  const k=Math.min(B.w/A.w,B.h/A.h),out=JSON.parse(JSON.stringify(design));out.format=fmt;
  out.layers.forEach(l=>{
    /* Слои, прижатые к краям холста (фон-панели, полосы), остаются прижатыми,
       а «от края до края» — растягиваются; остальное — единый масштаб от центра. */
    const L=l.x<=1,R=l.x+l.w>=99,T=l.y<=1,Bt=l.y+l.h>=99,ox=l.x,ow=l.w,oy=l.y,oh=l.h;
    const cx=(l.x+l.w/2)/100,cy=(l.y+l.h/2)/100,wpx=l.w/100*A.w*k,hpx=l.h/100*A.h*k;
    l.w=wpx/B.w*100;l.h=hpx/B.h*100;l.x=cx*100-l.w/2;l.y=cy*100-l.h/2;
    if(l.type==="shape"||l.type==="image"&&!l.src){
      if(L&&R){l.x=ox;l.w=ow}else if(L)l.x=ox;else if(R)l.x=100-l.w-(100-ox-ow);
      if(T&&Bt){l.y=oy;l.h=oh}else if(T)l.y=oy;else if(Bt)l.y=100-l.h-(100-oy-oh);
    }
    if(l.type==="text")l.fontSize=Math.round(l.fontSize*A.h*k/B.h*100)/100;
  });
  return out;
}
