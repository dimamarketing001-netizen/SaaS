const STUDIO_ROLES={headline:"Заголовок",subheadline:"Подзаголовок",cta:"Кнопка",badge:"Плашка",disclaimer:"Мелкий текст"};
function studioTextByRole(d,role){
  const texts=d.layers.filter(l=>l.type==="text");
  const exact=texts.find(l=>l.role===role);if(exact)return exact;
  const free=texts.filter(l=>!l.role);
  if(role==="headline"&&free.length)return free.slice().sort((a,b)=>b.fontSize-a.fontSize)[0];
  if(role==="cta")return free.find(l=>l.bgColor)||null;
  return null;
}
function studioApplyTexts(d,v){
  let added=0;
  for(const[role,text]of Object.entries(v||{})){
    if(!text||!STUDIO_ROLES[role])continue;
    let l=studioTextByRole(d,role);
    if(l){l.text=text;l.role=l.role||role;studioFitText(l,d);continue}
    l=studioLayerDefaults("text");
    const dark=(d.bg.color||"#fff").replace("#","");const lum=dark.length===6?(parseInt(dark.slice(0,2),16)*299+parseInt(dark.slice(2,4),16)*587+parseInt(dark.slice(4,6),16)*114)/1000:255;
    const ink=d.bg.type==="image"||lum<140?"#ffffff":"#141414";
    if(role==="headline")Object.assign(l,{x:8,y:10,w:84,h:22,fontSize:8.5,weight:"800",color:ink,shadow:d.bg.type==="image"});
    else if(role==="subheadline")Object.assign(l,{x:8,y:34,w:84,h:14,fontSize:4.2,weight:"400",color:ink,shadow:d.bg.type==="image"});
    else if(role==="cta")Object.assign(l,{x:22,y:76,w:56,h:11,fontSize:4.4,weight:"700",color:"#ffffff",bgColor:(S.studio.brand.colors||[])[0]||"#16c784",bgRadius:50});
    else if(role==="badge")Object.assign(l,{x:62,y:4,w:32,h:9,fontSize:4,weight:"800",color:"#ffffff",bgColor:"#ff3b30",bgRadius:30});
    else Object.assign(l,{x:8,y:90,w:84,h:6,fontSize:2.4,weight:"400",color:ink});
    l.text=text;l.role=role;studioFitText(l,d);d.layers.push(l);added++;
  }
  return added;
}

  async function go(launch,root){
    const sel=root?root.querySelector("[data-proj]"):null,pid=+(sel&&sel.value),p=projects.find(x=>x.id===pid);
    const ids=root?[...root.querySelectorAll("[data-pick]:checked")].map(x=>+x.dataset.pick):[];
    if(!p)return;if(!ids.length){toast("Отметьте хотя бы один дизайн",{tone:"warning"});return}

      if(launch)projectWizard(full);

function studioCtxAction(k){
  const d=studioDesign(),l=studioSelected();if(!l)return;
  studioBeforeChange();const i=d.layers.indexOf(l);
  if(k==="dup"){const c=JSON.parse(JSON.stringify(l));c.id=studioUid();c.x+=3;c.y+=3;delete c.group;d.layers.splice(i+1,0,c);d.selectedId=c.id}
  else if(k==="front"){d.layers.splice(i,1);d.layers.push(l)}
  else if(k==="back"){d.layers.splice(i,1);d.layers.unshift(l)}
  else if(k==="fwd"&&i<d.layers.length-1){[d.layers[i],d.layers[i+1]]=[d.layers[i+1],d.layers[i]]}
  else if(k==="bwd"&&i>0){[d.layers[i],d.layers[i-1]]=[d.layers[i-1],d.layers[i]]}
  else if(k==="lock")l.locked=!l.locked;
  else if(k==="hide")l.hidden=!l.hidden;
  else if(k==="del"){d.layers.splice(i,1);d.selectedId=null}
  else if(k==="fs+"||k==="fs-"){l.fontSize=Math.max(1,Math.round((l.fontSize+(k==="fs+"?0.5:-0.5))*10)/10)}
  N.refresh();NEON.save();
}
function studioMenu(x,y,items){
  document.querySelectorAll(".s2-menu").forEach(m=>m.remove());
  const m=document.createElement("div");m.className="s2-menu";
  /* it[3] — пункт выбран: как в списках библиотеки (подложка + галочка справа). */
  const ck=items.some(it=>it!=="-"&&it.length>3);
  m.innerHTML=items.map(it=>it==="-"?"<hr>":`<button type="button" data-i="${items.indexOf(it)}"${it[3]?' class="on" aria-checked="true"':""}><span class="t">${esc(it[0])}</span>${it[1]?`<small>${esc(it[1])}</small>`:""}${ck?`<span class="ck">${it[3]?ic("check",14):""}</span>`:""}</button>`).join("");
  document.body.append(m);const r=m.getBoundingClientRect();
  m.style.left=Math.min(x,innerWidth-r.width-8)+"px";m.style.top=Math.min(y,innerHeight-r.height-8)+"px";
  const close=()=>{m.remove();document.removeEventListener("mousedown",out,true)};
  const out=e=>{if(!m.contains(e.target))close()};
  setTimeout(()=>document.addEventListener("mousedown",out,true));
  m.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;close();items[+b.dataset.i][2]()});
}

function studioPenFinish(closed){
  const draft=studioPenDraft;studioPenDraft=null;studioDrag=null;
  if(!draft||draft.points.length<2){N.refresh();return}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  draft.points.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY);
  const pts=draft.points.map(p=>({
    x:(p.x-minX)/bw*100,y:(p.y-minY)/bh*100,type:p.type,
    out:p.out?{dx:p.out.dx/bw*100,dy:p.out.dy/bh*100}:null,
    in:p.in?{dx:p.in.dx/bw*100,dy:p.in.dy/bh*100}:null,
  }));
  const l=studioLayerDefaults("path");
  Object.assign(l,{x:minX,y:minY,w:bw,h:bh,points:pts,closed:!!closed});
  studioDesign().layers.push(l);studioDesign().selectedId=l.id;
  studioTool="select";
  N.refresh();NEON.save();
}

function studioAlign(dir){
  const d=studioDesign(),boxes=studioMultiSel.map(id=>d.layers.find(x=>x.id===id)).filter(Boolean);
  if(boxes.length<2)return;
  const minX=Math.min(...boxes.map(b=>b.x)),maxX=Math.max(...boxes.map(b=>b.x+b.w));
  const minY=Math.min(...boxes.map(b=>b.y)),maxY=Math.max(...boxes.map(b=>b.y+b.h));
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  boxes.forEach(b=>{
    if(dir==="left")b.x=minX;else if(dir==="right")b.x=maxX-b.w;else if(dir==="ch")b.x=cx-b.w/2;
    else if(dir==="top")b.y=minY;else if(dir==="bottom")b.y=maxY-b.h;else if(dir==="cv")b.y=cy-b.h/2;
  });
  boxes.forEach(studioPatchLayerDom);
}
function studioDistribute(dir){
  const d=studioDesign();let boxes=studioMultiSel.map(id=>d.layers.find(x=>x.id===id)).filter(Boolean);
  if(boxes.length<3)return;
  if(dir==="h"){
    boxes=boxes.slice().sort((a,b)=>a.x-b.x);
    const first=boxes[0],last=boxes[boxes.length-1],span=(last.x+last.w)-first.x,sumW=boxes.reduce((s,b)=>s+b.w,0),gap=(span-sumW)/(boxes.length-1);
    let runX=first.x;
    boxes.forEach((b,i)=>{if(i>0&&i<boxes.length-1)b.x=runX+gap;runX=b.x+b.w+gap});
  }else{
    boxes=boxes.slice().sort((a,b)=>a.y-b.y);
    const first=boxes[0],last=boxes[boxes.length-1],span=(last.y+last.h)-first.y,sumH=boxes.reduce((s,b)=>s+b.h,0),gap=(span-sumH)/(boxes.length-1);
    let runY=first.y;
    boxes.forEach((b,i)=>{if(i>0&&i<boxes.length-1)b.y=runY+gap;runY=b.y+b.h+gap});
  }
  boxes.forEach(studioPatchLayerDom);
}

    const dxBox=studioToBoxPct(dxPct,studioDrag.boxW),dyBox=studioToBoxPct(dyPct,studioDrag.boxH);

      const nd=studioDrag.startDx+dxBox,ndy=studioDrag.startDy+dyBox;
      if(studioDrag.side==="out"){p.out={dx:nd,dy:ndy};if(p.type==="smooth")p.in={dx:-nd,dy:-ndy}}

  }

    studioDrag.box={x1:(x1-r.left)/r.width*100,y1:(y1-r.top)/r.height*100,x2:(x2-r.left)/r.width*100,y2:(y2-r.top)/r.height*100};
    return;
  }
  if(studioDrag.mode==="multimove"){
    const dx=(e.clientX-studioDrag.startX)/studioDrag.rect.width*100,dy=(e.clientY-studioDrag.startY)/studioDrag.rect.height*100;
    studioDrag.items.forEach(it=>{const l=d.layers.find(x=>x.id===it.id);if(!l)return;l.x=it.x+dx;l.y=it.y+dy;const el=document.querySelector(`.stud-layer[data-id="${l.id}"]`);if(el){el.style.left=l.x+"%";el.style.top=l.y+"%"}});
    studioSyncPropsSoon();return;
  }
  const l=d.layers.find(x=>x.id===studioDrag.id);if(!l)return;
  if(studioDrag.mode==="rotate"){
    let a=Math.atan2(e.clientY-studioDrag.cy,e.clientX-studioDrag.cx)*180/Math.PI+90;a=(a+360)%360;if(e.shiftKey)a=Math.round(a/15)*15%360;l.rotation=Math.round(a);
    const el=document.querySelector(`.stud-layer[data-id="${l.id}"]`);if(el)el.style.transform=studioLayerTransform(l);
    studioLive(e,l.rotation+"°");studioSyncPropsSoon();return;
  }
  const dxPct=(e.clientX-studioDrag.startX)/studioDrag.rect.width*100,dyPct=(e.clientY-studioDrag.startY)/studioDrag.rect.height*100;
  if(studioDrag.mode==="move"){
    let nx=Math.max(-l.w+3,Math.min(97,studioDrag.startXp+dxPct)),ny=Math.max(-l.h+3,Math.min(97,studioDrag.startYp+dyPct));

  }else{
    const c=studioDrag.corner||"se",sx=studioDrag.startXp,sy=studioDrag.startYp,sw=studioDrag.startW,sh=studioDrag.startH;
    let w=sw+(c==="se"||c==="ne"?dxPct:-dxPct),h=sh+(c==="se"||c==="sw"?dyPct:-dyPct);
    if(e.shiftKey||l.type==="icon"){const k=Math.max(w/sw,h/sh);w=sw*k;h=sh*k}

  studioSyncPropsSoon();
});

  });

function studioDrawRulers(){
  const box=document.querySelector(".stud-rbox.on"),stage=box&&box.querySelector(".stud-stage");if(!box||!stage)return;
  const d=studioDesign(),F=STUDIO_FMT[d.format]||STUDIO_FMT.square,cs=getComputedStyle(box),col=n=>cs.getPropertyValue(n).trim();
  const ink=col("--ink-3")||"#8a9096",line=col("--line-2")||"#d0d4d0",bg=col("--surface")||"#fff",page=col("--surface-2")||"#f3f4f2",acc=col("--svc-ink")||"#6a3fd4";
  const sr=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  let sel=null;
  if(studioMultiSel.length>1){const b=studioSelBox();if(b)sel=b}else{const l=studioSelected();if(l)sel=l}
  for(const cv of box.querySelectorAll(".stud-ruler")){
    const hor=cv.classList.contains("h"),r=cv.getBoundingClientRect(),W=Math.max(1,Math.round(r.width)),H=Math.max(1,Math.round(r.height));
    if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
    const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const len=hor?W:H,org=hor?sr.left-r.left:sr.top-r.top,full=hor?F.w:F.h,scale=(hor?sr.width:sr.height)/full;if(!(scale>0))continue;
    const P=v=>org+v*scale;
    c.fillStyle=bg;c.fillRect(0,0,W,H);
    c.fillStyle=page;hor?c.fillRect(P(0),0,full*scale,H):c.fillRect(0,P(0),W,full*scale);
    if(sel){const a=P(sel[hor?"x":"y"]/100*full),b=P((sel[hor?"x":"y"]+sel[hor?"w":"h"])/100*full);c.globalAlpha=.18;c.fillStyle=acc;hor?c.fillRect(a,0,b-a,H):c.fillRect(0,a,W,b-a);c.globalAlpha=1}
    const steps=[5,10,20,25,50,100,200,250,500,1000,2000],step=steps.find(st=>st*scale>=56)||2000,minor=step/(String(step)[0]==="2"&&step!==20?4:5);
    const from=Math.floor(-org/scale/minor)*minor,to=(len-org)/scale;

      if(hor){c.moveTo(q,H);c.lineTo(q,H-tl)}else{c.moveTo(W,q);c.lineTo(W-tl,q)}
      if(major){const t=String(Math.round(v));if(hor)c.fillText(t,q+3,2);else{c.save();c.translate(2,q-3);c.rotate(-Math.PI/2);c.fillText(t,0,0);c.restore()}}}
    c.stroke();
    c.strokeStyle=line;c.beginPath();hor?(c.moveTo(0,H-.5),c.lineTo(W,H-.5)):(c.moveTo(W-.5,0),c.lineTo(W-.5,H));c.stroke();
    if(sel){c.strokeStyle=acc;c.lineWidth=1.5;c.beginPath();for(const e of [sel[hor?"x":"y"],sel[hor?"x":"y"]+sel[hor?"w":"h"]]){const q=Math.round(P(e/100*full))+.5;hor?(c.moveTo(q,0),c.lineTo(q,H)):(c.moveTo(0,q),c.lineTo(W,q))}c.stroke()}
    if(!S.studio.guidesOff){c.fillStyle="#00b3ff";for(const g of studioGuides(d)){if(g.t!==(hor?"v":"h"))continue;const q=P(g.p);if(hor){c.beginPath();c.moveTo(q-4,H);c.lineTo(q+4,H);c.lineTo(q,H-6);c.fill()}else{c.beginPath();c.moveTo(W,q-4);c.lineTo(W,q+4);c.lineTo(W-6,q);c.fill()}}}
    if(studioRulerCursor){const q=Math.round(hor?studioRulerCursor.x-r.left:studioRulerCursor.y-r.top)+.5;if(q>0&&q<len){c.strokeStyle="#ff2d78";c.lineWidth=1;c.beginPath();hor?(c.moveTo(q,0),c.lineTo(q,H)):(c.moveTo(0,q),c.lineTo(W,q));c.stroke()}}
  }
}

function studioSnap(d,l,nx,ny){
  const T=1.1,X=[0,50,100].concat(studioGridX()),Y=[0,50,100];
  if(!S.studio.guidesOff&&S.studio.guideSnap!==false){const F=STUDIO_FMT[d.format]||STUDIO_FMT.square;studioGuides(d).forEach(g=>{if(g.t==="v")X.push(g.p/F.w*100);else if(g.t==="h")Y.push(g.p/F.h*100)})}

document.addEventListener("keydown",e=>{
  const r=NEON.route();if(r.s!=="studio"||r.v!=="editor")return;
  const typing=["INPUT","TEXTAREA"].includes((document.activeElement||{}).tagName);
  if(e.key==="Escape"){
    if(studioPenDraft){studioPenDraft=null;studioDrag=null;N.refresh();e.preventDefault()}
    else if(studioEditingPathId){studioEditingPathId=null;studioEditingPointIndex=null;N.refresh();e.preventDefault()}
    else if(studioTool!=="select"){studioTool="select";N.refresh();e.preventDefault()}
    return;
  }
  if(e.key==="Enter"&&studioPenDraft&&!typing){studioPenFinish(false);e.preventDefault();return}
  if((e.key==="Delete"||e.key==="Backspace")&&studioEditingPathId&&studioEditingPointIndex!=null&&!typing){studioPointDelete();e.preventDefault();return}
  const editing=typing||(document.activeElement&&document.activeElement.isContentEditable);
  if(e.key==="?"&&!editing){e.preventDefault();studioShortcuts();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();studioSaveDesign();return}
  if(!editing){
    const d=studioDesign(),ids=studioSelIds(),sel=d.layers.filter(x=>ids.includes(x.id)&&!x.locked);
    if(e.key.startsWith("Arrow")&&sel.length){
      e.preventDefault();studioBeforeChange();const st=e.shiftKey?5:0.5;
      sel.forEach(x=>{if(e.key==="ArrowLeft")x.x-=st;if(e.key==="ArrowRight")x.x+=st;if(e.key==="ArrowUp")x.y-=st;if(e.key==="ArrowDown")x.y+=st;studioPatchLayerDom(x)});
      studioSyncProps(null,true);NEON.save();return;
    }
    if((e.key==="Delete"||e.key==="Backspace")&&sel.length&&!studioEditingPathId){
      e.preventDefault();studioBeforeChange();d.layers=d.layers.filter(x=>!sel.includes(x));d.selectedId=null;studioMultiSel=[];N.refresh();NEON.save();return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="g"){e.preventDefault();studioGroup(!e.shiftKey);return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"){e.preventDefault();studioMultiSel=d.layers.filter(x=>!x.hidden&&!x.locked).map(x=>x.id);d.selectedId=studioMultiSel[studioMultiSel.length-1]||null;N.refresh();return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"&&ids.length){studioClipboard=JSON.stringify(d.layers.filter(x=>ids.includes(x.id)));toast("Скопировано слоёв: "+ids.length);return}
    if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="v"&&studioClipboard||e.key.toLowerCase()==="d"&&sel.length)){
      e.preventDefault();studioBeforeChange();
      const src=e.key.toLowerCase()==="v"?JSON.parse(studioClipboard):JSON.parse(JSON.stringify(sel));
      const added=src.map(x=>({...x,id:studioUid(),x:x.x+3,y:x.y+3,locked:false}));

    }
  }
  if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==="z"){e.preventDefault();if(e.shiftKey)studioRedo();else studioUndo();return}
  if((e.ctrlKey||e.metaKey)&&!typing&&e.key.toLowerCase()==="y"){e.preventDefault();studioRedo();return}
});

  async studFromCreative(a,d){
    const g=findGroup(d.id);
    if(!g){toast("Креатив не найден",{tone:"warning"});return}
    const rep=g.representative,design=studioNewDesign();
    design.name=("По мотивам: "+(rep.title||"креатив")).slice(0,60);
    toast("Собираю дизайн: картинка и текст под наш оффер…");
    const img=rep.creative_type==="video"?(rep.video_poster||rep.image_url):rep.image_url;
    if(img){
      /* Картинку качает сервер: чужой домен без CORS «пачкает» canvas, и экспорт PNG падал. */
      try{const r=await studioFetchImage(img,1600);design.bg={type:"image",image:r.data_url}}
      catch(e){toast("Картинку креатива скачать не удалось — фон оставлен цветным",{tone:"warning"})}
    }
    /* Текст конкурента дословно не копируем: ИИ переписывает под бриф. */
    let texts=null;
    try{texts=await apiPost("/api/v1/studio/ai/rewrite",{title:rep.title||"",description:rep.description||"",brief:S.studio.brief||""})}
    catch(e){toast("ИИ недоступен — подставлен текст конкурента, перепишите его",{tone:"warning"});texts={headline:(rep.title||"").slice(0,60)}}
    if(design.bg.type==="image"){const sh=studioLayerDefaults("shape","rect");Object.assign(sh,{x:0,y:55,w:100,h:45,radius:0,fill:{type:"gradient",color:"rgba(0,0,0,0)",color2:"#000000",angle:180},opacity:85});design.layers.push(sh)}
    studioApplyTexts(design,{headline:texts.headline,subheadline:texts.subheadline,cta:texts.cta,badge:texts.badge});
    /* Раскладка снизу вверх без перекрытий: заголовок 50–72, подзаголовок 73–84, кнопка 86–95. */
    const place={headline:{x:7,y:50,w:86,h:22},subheadline:{x:7,y:73,w:86,h:11},cta:{x:24,y:86,w:52,h:9},badge:{x:64,y:5,w:30,h:8}};
    design.layers.forEach(l=>{if(l.type!=="text"||!place[l.role])return;Object.assign(l,place[l.role]);
      if(l.role==="headline"||l.role==="subheadline"){l.color="#ffffff";l.shadow=design.bg.type==="image";l.align="left"}
      studioFitText(l,design)});
    studioResetEphemeral();S.studio.editor=design;N.go("studio-editor");studioPersist({silent:true});
    toast("Дизайн создан из креатива — тексты переписаны ИИ",{tone:"success"});
  }
});
