name: Ad Intelligence smoke tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ad-intelligence.html'
      - 'tests/ad-intelligence-smoke.cjs'
      - '.github/workflows/ad-intelligence-smoke.yml'
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'index.html'
      - 'ad-intelligence.html'
      - 'tests/ad-intelligence-smoke.cjs'
      - '.github/workflows/ad-intelligence-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Ad Intelligence smoke tests
        run: node tests/ad-intelligence-smoke.cjs
