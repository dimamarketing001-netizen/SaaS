<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>ParsYa Ads — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f8;--ink:#20262f;--muted:#7b8491;--line:#e6e9ed;--green:#39c978;--green-dark:#16884b;--green-tint:#ddf9e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Manrope",sans-serif;font-size:14px;padding:24px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 2px 8px #202b3505}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brandmark{width:42px;height:42px;border-radius:14px;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;font:800 20px Manrope,sans-serif;flex-shrink:0}
.brandname{font:800 16px Manrope,sans-serif;letter-spacing:.04em}
.brandname small{display:block;font:600 10px Manrope,sans-serif;color:var(--muted);letter-spacing:.1em;margin-top:2px}
h1{font:800 21px Manrope,sans-serif;letter-spacing:-.03em;margin:0 0 6px}
p.lead{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;color:#596371;margin-bottom:7px}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;outline:none;background:#fafbfc}
.field input:focus{border-color:var(--green)}
button.primary{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;padding:13px;font:700 13px Manrope,sans-serif;cursor:pointer;transition:background .15s}
button.primary:hover{background:#2db968}
button.primary:disabled{opacity:.6;cursor:default}
.error{background:#fff0f0;border:1px solid #f6d6d6;color:#b84a4a;border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:16px;display:none}
.error.show{display:block}
details{margin-top:20px}
summary{font-size:11px;color:var(--muted);cursor:pointer}
.advanced{margin-top:12px}
.advanced input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:11px;outline:none}
.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
 <div class="brand"><div class="brandmark">P</div><div class="brandname">ParsYa Ads<small>КРЕАТИВЫ ПО РЕКЛАМОДАТЕЛЯМ</small></div></div>
 <h1>Вход в сервис</h1>
 <p class="lead">Войдите, чтобы искать рекламные креативы по ИНН рекламодателя, домену или тексту объявления.</p>
 <div class="error" id="loginError"></div>
 <form id="loginForm">
  <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" placeholder="you@company.ru"></div>
  <div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
  <button class="primary" type="submit" id="submitBtn">Войти</button>
 </form>
 <details>
  <summary>Другой адрес сервиса</summary>
  <div class="advanced"><input id="apiBase" placeholder="https://парсер.союзюристовроссии.рф"></div>
 </details>
 <div class="foot">Доступ выдаёт администратор сервиса.</div>
</div>
<script>
const DEFAULT_API_BASE = "https://xn--80ak2afbe.xn--b1ajdba5acbodeeeaj1qb.xn--p1ai";
const apiBaseInput = document.getElementById("apiBase");
apiBaseInput.value = localStorage.getItem("parsya_api_base") || DEFAULT_API_BASE;

function apiBase(){ return (apiBaseInput.value || DEFAULT_API_BASE).replace(/\/+$/, ""); }

if (localStorage.getItem("parsya_session")) {
  location.replace("overview.html");
}

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("loginError");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorBox.classList.remove("show");
  submitBtn.disabled = true;
  submitBtn.textContent = "Входим…";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const base = apiBase();
  try {
    const response = await fetch(base + "/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!response.ok) {
      const detail = response.status === 401 ? "Неверный email или пароль." : "Сервис недоступен. Проверьте адрес сервиса.";
      throw new Error(detail);
    }
    const data = await response.json();
    localStorage.setItem("parsya_api_base", base);
    localStorage.setItem("parsya_session", JSON.stringify(data));
    location.replace("overview.html");
  } catch (err) {
    errorBox.textContent = err.message || "Не удалось войти.";
    errorBox.classList.add("show");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Войти";
  }
});
</script>
</body>
</html>
