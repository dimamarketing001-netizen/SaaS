<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Просмотр дизайна</title>
<link rel="stylesheet" href="vendor/fonts/onest.css">
<style>
:root{--bg:#f4f4f1;--surface:#fff;--ink:#14161a;--ink-2:#4a4f57;--ink-3:#8a9099;--line:#e3e3de;--acc:#6d28d9;--acc-soft:#efe8fd;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--surface:#181b20;--ink:#eef0f3;--ink-2:#b8bec7;--ink-3:#7d848f;--line:#2a2f37;--acc:#a78bfa;--acc-soft:#2a2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1114;--surface:#181b20;--ink:#eef0f3;--ink-2:#b8bec7;--ink-3:#7d848f;--line:#2a2f37;--acc:#a78bfa;--acc-soft:#2a2340;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--ink-3);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:1100px;min-height:0}
.stage img{max-width:calc(100% - 110px);max-height:calc(100vh - 270px);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18);background:#fff;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.nav.p{left:0}.nav.n{right:0}.nav[disabled]{opacity:.35;cursor:default}
.count{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3)}
.thumbs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px}
.thumbs button{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;flex:none}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{height:64px;display:block;border-radius:6px}
.msg{max-width:420px;text-align:center;color:var(--ink-2)}
.msg h1{font-size:20px;font-weight:600;color:var(--ink);margin:0 0 6px}
.frame{position:relative;display:inline-block;line-height:0}.frame.cm img{cursor:crosshair}
.pin{position:absolute;transform:translate(-4px,-100%);min-width:24px;height:24px;padding:0 6px;border-radius:12px 12px 12px 2px;border:2px solid #fff;background:#f59e0b;color:#fff;font:600 12px/20px ui-monospace,monospace;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.pin.new{background:var(--acc)}
.cform{position:absolute;z-index:5;width:260px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.cform input,.cform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.cform .row{display:flex;gap:6px;justify-content:flex-end}
.clist{width:100%;max-width:760px;display:flex;flex-direction:column;gap:6px}
.citem{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.citem b{font-weight:600}.citem small{color:var(--ink-3)}.citem .n{flex:none;width:24px;height:24px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font:600 12px ui-monospace,monospace}
.btn.on{border-color:var(--acc);color:var(--acc)}
.hint{font-size:13px;color:var(--ink-2)}
footer{padding:10px 20px;color:var(--ink-3);font-size:12px;text-align:center}
@media (max-width:640px){header{padding:12px 16px}.nav{display:none}.stage img{max-width:100%;max-height:calc(100vh - 280px)}.btn .t{display:none}}
</style>
</head>
<body>
<header><div class="logo">N</div><div class="ttl"><b id="nm">Загрузка…</b><small id="sub"></small></div><button class="btn" id="cmb" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="t">Комментировать</span></button><a class="btn pri" id="dl" hidden download><span aria-hidden="true">↓</span><span class="t">Скачать</span></a></header>
<main id="main"><p class="msg">Загружаю дизайн…</p></main>
<footer>Ссылка на просмотр из NEON Студии. Комментарии видят владелец дизайна и все, у кого есть ссылка. Владелец может отключить её в любой момент.</footer>
<script>
(function(){
  const t=new URLSearchParams(location.search).get("t")||"";
  const main=document.getElementById("main"),nm=document.getElementById("nm"),sub=document.getElementById("sub"),dl=document.getElementById("dl"),cmb=document.getElementById("cmb");
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const fail=(h,p)=>{nm.textContent="Просмотр дизайна";sub.textContent="";main.innerHTML=`<div class="msg"><h1>${esc(h)}</h1><p>${esc(p)}</p></div>`};
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(t)){fail("Ссылка не найдена","Проверьте, что ссылка скопирована целиком.");return}
  fetch(location.origin+"/api/v1/studio/share/"+encodeURIComponent(t),{cache:"no-store"}).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(D=>{
    const P=(D.pages||[]).filter(u=>/^data:image\/(png|jpeg|webp);base64,/.test(u));if(!P.length){fail("Пусто","В этой ссылке нет страниц.");return}
    document.title=(D.name||"Дизайн")+" — просмотр";nm.textContent=D.name||"Дизайн";
    sub.textContent=`${D.width}×${D.height} · ${P.length>1?P.length+" стр. · ":""}обновлено ${new Date(D.updated_at*1000).toLocaleString("ru",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}`;
    let i=0;
    main.innerHTML=`<div class="stage">${P.length>1?'<button class="nav p" aria-label="Предыдущая">‹</button>':""}<div class="frame" id="fr"><img id="im" alt=""></div>${P.length>1?'<button class="nav n" aria-label="Следующая">›</button>':""}</div>
      <p class="hint" id="chint" hidden>Нажмите на место на картинке, к которому относится замечание.</p>${P.length>1?`<div class="count" id="cnt"></div><div class="thumbs">${P.map((u,k)=>`<button data-k="${k}" aria-label="Страница ${k+1}"><img src="${u}" alt=""></button>`).join("")}</div>`:""}<div class="clist" id="cl"></div>`;
    const im=document.getElementById("im"),cnt=document.getElementById("cnt"),fr=document.getElementById("fr"),cl=document.getElementById("cl"),chint=document.getElementById("chint");
    const C=D.comments||[];let cmode=false;cmb.hidden=false;
    const paintC=()=>{fr.querySelectorAll(".pin").forEach(x=>x.remove());const L=C.filter(c=>c.page===i);
      L.forEach((c,k)=>{const b=document.createElement("button");b.className="pin";b.style.left=c.x+"%";b.style.top=c.y+"%";b.textContent=k+1;b.title=(c.name||"Клиент")+": "+c.text;fr.append(b)});
      cl.innerHTML=L.map((c,k)=>`<div class="citem"><span class="n">${k+1}</span><div><b>${esc(c.name||"Клиент")}</b> <small>${new Date(c.created_at*1000).toLocaleString("ru",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small><div>${esc(c.text)}</div></div></div>`).join("")};
    cmb.onclick=()=>{cmode=!cmode;cmb.classList.toggle("on",cmode);fr.classList.toggle("cm",cmode);chint.hidden=!cmode;fr.querySelector(".cform")?.remove()};
    im.addEventListener("click",e=>{if(!cmode)return;const r=im.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*1000)/10,y=Math.round((e.clientY-r.top)/r.height*1000)/10;
      fr.querySelector(".cform")?.remove();fr.querySelector(".pin.new")?.remove();const pin=document.createElement("span");pin.className="pin new";pin.style.left=x+"%";pin.style.top=y+"%";pin.textContent="+";fr.append(pin);
      const f=document.createElement("div");f.className="cform";f.style.left=Math.min(x,60)+"%";f.style.top=Math.min(y+2,70)+"%";
      let nmv="";try{nmv=localStorage.getItem("neon-share-name")||""}catch(er){}
      f.innerHTML=`<input maxlength="60" placeholder="Ваше имя" value="${esc(nmv)}"><textarea rows="3" maxlength="1000" placeholder="Что поправить?"></textarea><div class="row"><button class="btn" data-c="x">Отмена</button><button class="btn pri" data-c="ok">Отправить</button></div>`;
      fr.append(f);f.querySelector("textarea").focus();
      f.addEventListener("click",async ev=>{ev.stopPropagation();const b=ev.target.closest("[data-c]");if(!b)return;if(b.dataset.c==="x"){f.remove();pin.remove();return}
        const name=f.querySelector("input").value.trim(),text=f.querySelector("textarea").value.trim();if(!text){f.querySelector("textarea").focus();return}
        try{localStorage.setItem("neon-share-name",name)}catch(er){}b.disabled=true;
        try{const r2=await fetch(location.origin+"/api/v1/studio/share/"+encodeURIComponent(t)+"/comments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page:i,x,y,name,text})});const j=await r2.json();if(!r2.ok)throw new Error(j.detail||"Ошибка");
          C.push({id:j.id,page:i,x,y,name,text,created_at:j.created_at});f.remove();pin.remove();paintC()}catch(er){b.disabled=false;alert("Не отправилось: "+er.message)}});
      f.addEventListener("keydown",ev=>ev.stopPropagation())});
    const show=k=>{i=Math.max(0,Math.min(P.length-1,k));im.src=P[i];im.alt="Страница "+(i+1);
      const ext=P[i].startsWith("data:image/png")?"png":"jpg";dl.href=P[i];dl.download=(D.name||"design").replace(/[\\/:*?"<>|]+/g,"_")+(P.length>1?"_"+(i+1):"")+"."+ext;dl.hidden=false;
      if(cnt)cnt.textContent=(i+1)+" / "+P.length;main.querySelectorAll(".thumbs button").forEach(b=>b.classList.toggle("on",+b.dataset.k===i));
      const p=main.querySelector(".nav.p"),n=main.querySelector(".nav.n");if(p)p.disabled=i===0;if(n)n.disabled=i===P.length-1;fr.querySelector(".cform")?.remove();fr.querySelector(".pin.new")?.remove();paintC()};
    main.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.closest(".cform")||b.classList.contains("pin"))return;if(b.classList.contains("p"))show(i-1);else if(b.classList.contains("n"))show(i+1);else if(b.dataset.k)show(+b.dataset.k)});
    document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")show(i-1);if(e.key==="ArrowRight")show(i+1)});
    let x0=null;im.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});im.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(i+(dx<0?1:-1));x0=null});
    show(0);
  }).catch(st=>{st===404?fail("Ссылка отключена","Владелец дизайна отключил эту ссылку или удалил дизайн."):fail("Не удалось загрузить","Сервер недоступен, попробуйте обновить страницу чуть позже.")});
})();
</script>
</body>
</html>
